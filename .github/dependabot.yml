version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "security"

    commit-message:
      prefix: "deps"

    # Preserve valid exact local-version pins (for example, PyTorch +cpu) unless
    # the current requirement blocks the available update.
    versioning-strategy: increase-if-necessary
