name: Diagnose Contract 628

on:
  pull_request:
    branches: ["main"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q jsonschema pytest
      - name: Capture contract failure
        id: contract
        continue-on-error: true
        run: |
          PYTHONPATH=.:python:python/modules \
            python -m pytest -q python/tests/test_trusted_runtime_*.py --tb=short \
            > contract-diagnostic.txt 2>&1
      - name: Show diagnostic tail
        if: always()
        run: tail -n 160 contract-diagnostic.txt
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-628-diagnostic
          path: contract-diagnostic.txt
          if-no-files-found: error
      - name: Enforce contract result
        if: steps.contract.outcome == 'failure'
        run: exit 1
