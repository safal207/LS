name: Goals Track Center

on:
  push:
    branches: [main, "feat/goals-track-v0.1"]
  pull_request:
    paths:
      - "python/modules/trusted_runtime/goals_commitments_track_center.py"
      - "python/tests/test_trusted_runtime_goals_commitments_track_center.py"
      - "schemas/trusted_runtime/goal_commitment_result.schema.json"
      - "scripts/run_goals_commitments_track_demo.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install jsonschema pytest ruff==0.15.5
      - run: ruff check python/modules/trusted_runtime/goals_commitments_track_center.py python/tests/test_trusted_runtime_goals_commitments_track_center.py scripts/run_goals_commitments_track_demo.py
      - run: PYTHONPATH=.:python:python/modules python -m pytest python/tests/test_trusted_runtime_continuity_coordinator.py python/tests/test_trusted_runtime_goals_commitments_track_center.py
      - run: PYTHONPATH=.:python:python/modules python scripts/run_goals_commitments_track_demo.py --output build/goals-commitments-track-center
