name: One-shot exact vector count fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: one-shot-exact-vector-count-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'safal207/LS' && github.event.pull_request.number == 907
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inter-agent-dispatch-audit-v0-1
          fetch-depth: 0
      - name: Apply bounded exact-count patch
        run: |
          python - <<'PY'
          from pathlib import Path

          validator_path = Path("tools/validate_inter_agent_dispatch_audit_v0_1.py")
          validator = validator_path.read_text(encoding="utf-8")

          unexpected_block = '''    unexpected_cases = sorted(seen_cases - REQUIRED_VECTOR_CONTRACTS.keys())
          if unexpected_cases:
              error(
                  fixture_errors,
                  "UNEXPECTED_NEGATIVE_CASES",
                  "negative_vectors",
                  f"unexpected v0.1 cases: {unexpected_cases}",
              )

          '''
          marker = '    expected = fixture.get("expected", {})\n'
          if "UNEXPECTED_NEGATIVE_CASES" not in validator:
              if marker not in validator:
                  raise SystemExit("expected block marker not found")
              validator = validator.replace(marker, unexpected_block + marker, 1)

          old_count = "        and len(vector_results) >= len(REQUIRED_VECTOR_CONTRACTS)\n"
          new_count = "        and len(vector_results) == len(REQUIRED_VECTOR_CONTRACTS)\n"
          if old_count in validator:
              validator = validator.replace(old_count, new_count, 1)
          elif new_count not in validator:
              raise SystemExit("vector count condition not found")
          validator_path.write_text(validator, encoding="utf-8")

          schema_path = Path("fixtures/operational-continuity/inter-agent-dispatch-audit/schema-v0.1.json")
          schema = schema_path.read_text(encoding="utf-8")
          old_schema = '"negative_vectors":{"type":"array","minItems":14,'
          new_schema = '"negative_vectors":{"type":"array","minItems":14,"maxItems":14,'
          if new_schema not in schema:
              if old_schema not in schema:
                  raise SystemExit("negative_vectors schema header not found")
              schema = schema.replace(old_schema, new_schema, 1)
          schema_path.write_text(schema, encoding="utf-8")
          PY
          python -m py_compile tools/validate_inter_agent_dispatch_audit_v0_1.py
          python tools/validate_inter_agent_dispatch_audit_v0_1.py \
            fixtures/operational-continuity/inter-agent-dispatch-audit/dispatch_chain_v0.1.json \
            fixtures/operational-continuity/inter-agent-dispatch-audit/schema-v0.1.json \
            > /tmp/canonical.json
          python -c 'import json; report=json.load(open("/tmp/canonical.json", encoding="utf-8")); assert report["passed"] is True; assert len(report["negative_vectors"]) == 14'
          python - <<'PY'
          import copy
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          fixture_path = Path("fixtures/operational-continuity/inter-agent-dispatch-audit/dispatch_chain_v0.1.json")
          schema_path = Path("fixtures/operational-continuity/inter-agent-dispatch-audit/schema-v0.1.json")
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))
          extra = copy.deepcopy(fixture["negative_vectors"][-1])
          extra["case"] = "extra_malformed_content_digest"
          fixture["negative_vectors"].append(extra)
          with tempfile.TemporaryDirectory() as tmp_dir:
              mutated = Path(tmp_dir) / "fixture.json"
              mutated.write_text(json.dumps(fixture), encoding="utf-8")
              result = subprocess.run(
                  [sys.executable, "tools/validate_inter_agent_dispatch_audit_v0_1.py", str(mutated), str(schema_path)],
                  check=False,
                  capture_output=True,
                  text=True,
              )
          assert result.returncode == 1, result.stdout + result.stderr
          report = json.loads(result.stdout)
          codes = {item["code"] for item in report["fixture_errors"]}
          assert "UNEXPECTED_NEGATIVE_CASES" in codes, report
          assert "SCHEMA_VALIDATION_FAILED" in codes, report
          PY
      - name: Commit exact-count fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/validate_inter_agent_dispatch_audit_v0_1.py \
            fixtures/operational-continuity/inter-agent-dispatch-audit/schema-v0.1.json
          git commit -m "enforce exact negative vector count"
          git push origin HEAD:agent/inter-agent-dispatch-audit-v0-1
