name: Security & CI Pipeline

on:
  push:
    branches: ["main", "fix/post-1.2.1-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev build-essential

      - name: Upgrade tooling
        run: |
          python -m pip install --upgrade "pip>=26.0.1" setuptools wheel

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Install security and test tools
        run: |
          pip install pip-audit cyclonedx-bom pip-tools pytest mock

      - name: Compile and Install dependencies
        run: |
          pip-compile requirements.in --output-file requirements.txt
          pip install -r requirements.txt

      - name: Run hardening verification tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_hardening_verification.py tests/test_vision_extended.py

      - name: Vulnerability audit
        run: |
          # Temporary exception: CVE-2026-4539 has no fixed PyPI release yet.
          # Keep this scoped to a single CVE and remove once upstream ships a fix.
          pip-audit --local --desc --progress-spinner off --ignore-vuln CVE-2026-4539

      - name: Generate SBOM
        run: |
          cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Dependency Review (skipped if Graph not enabled)
        run: |
          echo "Dependency Review skipped. Enable Dependency Graph in repo settings to activate."
          exit 0
