name: Security & CI Pipeline

on:
  push:
    branches: ["main", "fix/post-1.2.1-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi

      - name: Install security and test tools
        run: |
          pip install pip-audit cyclonedx-bom pip-tools pytest mock

      - name: Verify requirements.txt matches requirements.in
        run: |
          pip-compile requirements.in --output-file requirements.txt.check
          diff requirements.txt requirements.txt.check || true

      - name: Run hardening verification tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_hardening_verification.py tests/test_vision_extended.py

      - name: Vulnerability audit
        run: |
          pip-audit --strict --desc --progress-spinner off || true

      - name: Generate SBOM
        run: |
          cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Dependency Review (skipped if Graph not enabled)
        run: |
          echo "Dependency Review skipped. Enable Dependency Graph in repo settings to activate."
          exit 0
