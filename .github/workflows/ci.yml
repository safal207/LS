name: Security & CI Pipeline

on:
  push:
    branches: ["main", "fix/post-1.2.1-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      security-events: write
    env:
      LIMINALQA_URL: ${{ secrets.LIMINALQA_URL }}
      LIMINALQA_TOKEN: ${{ secrets.LIMINALQA_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev build-essential

      - name: Upgrade tooling
        run: |
          python -m pip install --upgrade "pip>=26.0.1" setuptools wheel

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Install security and test tools
        run: |
          pip install pip-audit cyclonedx-bom pip-tools pytest pytest-cov mock

      - name: Compile and Install dependencies
        run: |
          pip-compile requirements.in --output-file requirements.txt
          pip install -r requirements.txt

      - name: Run hardening verification tests
        uses: ./.github/actions/run-pytest-liminalqa
        with:
          liminalqa-plan: critical-smoke
          pytest-invocation: >-
            PYTHONPATH=. python -m pytest
            tests/test_hardening_verification.py
            tests/test_vision_extended.py
            --junitxml=artifacts/security-junit.xml
            --cov=agent
            --cov=codex
            --cov=python/modules
            --cov-report=xml:artifacts/security-coverage.xml
      - name: Summarize quality artifacts
        if: always()
        uses: ./.github/actions/summarize-quality-artifacts
        with:
          label: security-and-tests
      - id: quality_gate
        name: Quality gate
        if: always()
        uses: ./.github/actions/quality-gate
        with:
          label: security-and-tests
          max-failures: "0"
          min-line-coverage: "12"
          require-junit: "true"
          require-coverage: "true"
          enforce: "true"
      - name: Update PR quality comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          GATE_VERDICT: ${{ steps.quality_gate.outputs.verdict }}
          GATE_TOTAL_FAILURES: ${{ steps.quality_gate.outputs.total-failures }}
          GATE_MIN_COVERAGE: ${{ steps.quality_gate.outputs.min-line-coverage-observed }}
        with:
          script: |
            const marker = '<!-- quality-gate:security-and-tests -->';
            const coverage = process.env.GATE_MIN_COVERAGE
              ? `${Number(process.env.GATE_MIN_COVERAGE).toFixed(1)}%`
              : 'n/a';
            const body = [
              marker,
              '### Security & CI Quality Gate',
              '',
              `- verdict: \`${process.env.GATE_VERDICT || 'unknown'}\``,
              `- failures+errors: \`${process.env.GATE_TOTAL_FAILURES || 'n/a'}\``,
              `- min line coverage observed: \`${coverage}\``,
              '- threshold: `12%`',
              '',
              `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Vulnerability audit
        run: |
          # Temporary exception: CVE-2026-4539 has no fixed PyPI release yet.
          # Keep this scoped to a single CVE and remove once upstream ships a fix.
          pip-audit --local --desc --progress-spinner off --ignore-vuln CVE-2026-4539

      - name: Generate SBOM
        run: |
          cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-ci-artifacts
          path: artifacts/

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Dependency Review (skipped if Graph not enabled)
        run: |
          echo "Dependency Review skipped. Enable Dependency Graph in repo settings to activate."
          exit 0
