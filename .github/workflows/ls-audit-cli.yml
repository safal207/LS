name: LS Exact-Head Audit CLI

on:
  pull_request:
    paths:
      - packages/ls-audit-cli/**
      - .github/workflows/ls-audit-cli.yml
  push:
    branches: [main]
    paths:
      - packages/ls-audit-cli/**
      - .github/workflows/ls-audit-cli.yml

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/ls-audit-cli/pyproject.toml
      - name: Install lightweight CLI
        run: python -m pip install ./packages/ls-audit-cli
      - name: Run unit tests
        run: python -m unittest discover -s packages/ls-audit-cli/tests -v
      - name: Verify console entrypoint
        run: ls-audit --help
      - name: Build wheel
        run: python -m pip wheel --no-deps ./packages/ls-audit-cli --wheel-dir /tmp/ls-audit-wheel
      - name: Live exact-head smoke on this PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          start="$(date +%s)"
          ls-audit "$PR_URL" --expected-head "$EXPECTED_HEAD" --output /tmp/ls-audit-live
          elapsed="$(( $(date +%s) - start ))"
          test "$elapsed" -le 900
          python - <<'PY'
          import json
          from pathlib import Path
          card = json.loads(Path('/tmp/ls-audit-live/scorecard.json').read_text())
          assert card['lanes']['exact_head'] == 'PASS'
          assert card['target']['expected_head'] == card['target']['observed_head']
          assert card['authority'] == 'advisory-only'
          print(card['verdict'])
          PY
