name: Route Artifact v2

on:
  pull_request:
    paths:
      - "schemas/route_artifact_v2.schema.json"
      - "python/modules/route_artifact.py"
      - "scripts/verify_route_artifact.py"
      - "scripts/verify_route_contract.py"
      - "tests/route_test_support.py"
      - "tests/test_route_artifact.py"
      - "tests/fixtures/routes/**"
      - "docs/ROUTE_ARTIFACT_V2.md"
      - ".github/workflows/route-artifact-v2.yml"
  push:
    branches: [main]
    paths:
      - "schemas/route_artifact_v2.schema.json"
      - "python/modules/route_artifact.py"
      - "scripts/verify_route_artifact.py"
      - "scripts/verify_route_contract.py"
      - "tests/route_test_support.py"
      - "tests/test_route_artifact.py"
      - "tests/fixtures/routes/**"
      - "docs/ROUTE_ARTIFACT_V2.md"
      - ".github/workflows/route-artifact-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install contract-test dependency
        run: python -m pip install 'jsonschema>=4.23,<5'

      - name: Verify complete Route Artifact contract
        shell: bash
        run: |
          set +e
          python scripts/verify_route_contract.py >route-contract.log 2>&1
          status=$?
          cat route-contract.log
          printf '%s\n' "$status" >route-contract.status
          exit "$status"

      - name: Preserve route contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-contract-evidence
          path: |
            route-contract.log
            route-contract.status
          if-no-files-found: error
          retention-days: 14
