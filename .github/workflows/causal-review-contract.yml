name: Causal Review Contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/grok-causal-pr-review.yml"
      - ".github/workflows/causal-review-contract.yml"
      - ".github/prompts/causal-review-v0.1.md"
      - "schemas/causal-review-v0.1.schema.json"
      - "schemas/deepseek-causal-lane-v0.1.schema.json"
      - "tools/causal_review.py"
      - "tools/grok_causal_review.py"
      - "tools/causal_review_adapters.py"
      - "tools/github_causal_review_collector.py"
      - "tools/deepseek_causal_review_adapter.py"
      - "tests/test_causal_review*.py"
      - "tests/test_github_causal_review_collector.py"
      - "tests/test_deepseek_causal_review*.py"
      - "docs/CAUSAL_REVIEW_CONTRACT_V0_1.md"
      - "docs/CAUSAL_REVIEW_ADAPTERS_V0_1.md"
      - "docs/CAUSAL_REVIEW_COLLECTION_AND_DEEPSEEK_V0_1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/grok-causal-pr-review.yml"
      - ".github/workflows/causal-review-contract.yml"
      - ".github/prompts/causal-review-v0.1.md"
      - "schemas/causal-review-v0.1.schema.json"
      - "schemas/deepseek-causal-lane-v0.1.schema.json"
      - "tools/causal_review.py"
      - "tools/grok_causal_review.py"
      - "tools/causal_review_adapters.py"
      - "tools/github_causal_review_collector.py"
      - "tools/deepseek_causal_review_adapter.py"
      - "tests/test_causal_review*.py"
      - "tests/test_github_causal_review_collector.py"
      - "tests/test_deepseek_causal_review*.py"
      - "docs/CAUSAL_REVIEW_CONTRACT_V0_1.md"
      - "docs/CAUSAL_REVIEW_ADAPTERS_V0_1.md"
      - "docs/CAUSAL_REVIEW_COLLECTION_AND_DEEPSEEK_V0_1.md"

permissions:
  contents: read

jobs:
  contract:
    name: Validate causal review contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Parse causal-review schemas
        run: |
          python -m json.tool schemas/causal-review-v0.1.schema.json >/dev/null
          python -m json.tool schemas/deepseek-causal-lane-v0.1.schema.json >/dev/null

      - name: Compile causal-review tooling
        run: >-
          python -m py_compile
          tools/causal_review.py
          tools/grok_causal_review.py
          tools/causal_review_adapters.py
          tools/github_causal_review_collector.py
          tools/deepseek_causal_review_adapter.py

      - name: Run deterministic contract tests
        run: >-
          PYTHONPATH=.
          python -m pytest
          tests/test_causal_review_contract.py
          tests/test_causal_review_patch_bytes.py
          tests/test_causal_review_adapters.py
          tests/test_causal_review_adapter_integrity.py
          tests/test_github_causal_review_collector.py
          tests/test_deepseek_causal_review_adapter.py
          tests/test_deepseek_causal_review_integrity.py
          -q

      - name: Check command-line interfaces
        run: |
          python tools/causal_review.py --help
          python tools/grok_causal_review.py --help
          python tools/causal_review_adapters.py --help
          python tools/github_causal_review_collector.py --help
          python tools/deepseek_causal_review_adapter.py --help
