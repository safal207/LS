name: Relationship Loss Track Center

on:
  push:
    branches:
      - "main"
      - "feat/relationship-loss-track-center-v0.1"
  pull_request:
    paths:
      - "python/modules/trusted_runtime/relationship_loss_track_center.py"
      - "python/tests/test_trusted_runtime_relationship_loss_track_center.py"
      - "schemas/trusted_runtime/relationship_loss_result.schema.json"
      - "scripts/run_relationship_loss_track_demo.py"
      - "docs/RELATIONSHIP_LOSS_TRACK_CENTER_V0_1.md"
      - ".github/workflows/relationship_loss_track_center.yml"

concurrency:
  group: relationship-loss-track-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest ruff

      - name: Ruff relationship/loss changes
        run: |
          ruff check \
            python/modules/trusted_runtime/relationship_loss_track_center.py \
            python/tests/test_trusted_runtime_relationship_loss_track_center.py \
            scripts/run_relationship_loss_track_demo.py

      - name: Run relationship/loss tests
        run: |
          PYTHONPATH=.:python:python/modules \
            python -m pytest \
              python/tests/test_trusted_runtime_continuity_coordinator.py \
              python/tests/test_trusted_runtime_relationship_loss_track_center.py

      - name: Generate deterministic reviewer artifacts
        run: |
          PYTHONPATH=.:python:python/modules \
            python scripts/run_relationship_loss_track_demo.py \
              --output build/relationship-loss-track-center

      - name: Verify safety boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/relationship-loss-track-center")
          summary = json.loads((root / "summary.json").read_text())
          assert summary["result"] == "PASS"
          decisions = {item["event_id"]: item for item in summary["decisions"]}

          assert decisions["relationship-event:remembered-influence"]["decision"] == (
              "ACCEPT_BOUNDED_OBSERVATION"
          )
          assert decisions["relationship-event:remembered-influence"][
              "lesson_candidate_emitted"
          ] is True
          assert decisions["relationship-event:false-presence"]["decision"] == (
              "BLOCK_FALSE_PRESENCE"
          )
          assert decisions["relationship-event:unknown-intention"]["decision"] == (
              "HOLD_FOR_REVIEW"
          )

          for item in decisions.values():
              assert item["relational_self_mutation_allowed"] is False
              assert item["stable_identity_update_allowed"] is False
              assert item["execution_authorized"] is False
          PY

      - name: Upload relationship/loss evidence bundle
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: relationship-loss-track-center-evidence
          path: build/relationship-loss-track-center
          if-no-files-found: error
