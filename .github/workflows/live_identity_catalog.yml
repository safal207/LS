name: Signed Live Identity Catalog

on:
  push:
    branches:
      - "feat/live-identity-catalog"
  pull_request:
    paths:
      - "python/modules/trusted_runtime/identity_catalog.py"
      - "python/modules/trusted_runtime/identity_live_viewer.py"
      - "python/tests/identity_live_catalog_fixtures.py"
      - "python/tests/test_identity_catalog.py"
      - "python/tests/test_identity_live_viewer*.py"
      - "schemas/trusted_runtime/identity_catalog.schema.json"
      - "scripts/build_identity_catalog.py"
      - "scripts/serve_live_identity_viewer.py"
      - ".github/workflows/live_identity_catalog.yml"

concurrency:
  group: live-identity-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    env:
      LS_IDENTITY_CATALOG_SECRET: ci-catalog-key-material

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest ruff==0.15.5

      - name: Ruff catalog and viewer changes
        run: |
          ruff check \
            python/modules/trusted_runtime/identity_catalog.py \
            python/modules/trusted_runtime/identity_live_viewer.py \
            python/tests/identity_live_catalog_fixtures.py \
            python/tests/test_identity_catalog.py \
            python/tests/test_identity_live_viewer.py \
            python/tests/test_identity_live_viewer_fail_closed.py \
            python/tests/test_identity_live_viewer_wsgi.py \
            scripts/build_identity_catalog.py \
            scripts/serve_live_identity_viewer.py

      - name: Run catalog viewer and regression tests
        run: |
          PYTHONPATH=.:python:python/modules:python/tests \
            python -m pytest \
              python/tests/test_identity_catalog.py \
              python/tests/test_identity_live_viewer.py \
              python/tests/test_identity_live_viewer_fail_closed.py \
              python/tests/test_identity_live_viewer_wsgi.py \
              python/tests/test_identity_timeline_api.py \
              python/tests/test_identity_timeline_api_fail_closed.py \
              python/tests/test_identity_timeline_dashboard.py \
              python/tests/test_identity_timeline_projection.py \
              python/tests/test_identity_timeline_failures.py

      - name: Generate two governed agent timelines
        run: |
          PYTHONPATH=.:python:python/modules:python/tests python - <<'PY'
          from pathlib import Path
          from identity_timeline_api_fixtures import build_timeline_bundle

          root = Path("build/live-identity-data")
          build_timeline_bundle(root, "agent:live-reviewer")
          build_timeline_bundle(root, "agent:live-auditor")
          PY

      - name: Build signed catalog with production CLI
        run: |
          PYTHONPATH=.:python:python/modules \
            python scripts/build_identity_catalog.py \
              --data-root build/live-identity-data \
              --output build/live-identity-catalog.json \
              --key-id ci-key-v1 \
              --generated-at 2026-06-24T06:30:00Z

      - name: Validate catalog and export paginated API evidence
        run: |
          PYTHONPATH=.:python:python/modules python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from modules.trusted_runtime.identity_catalog import load_signed_identity_catalog
          from modules.trusted_runtime.identity_live_viewer import (
              CatalogIdentityTimelineRepository,
              SignedCatalogIdentityTimelineAPI,
          )

          root = Path("build/live-identity-data")
          catalog_path = Path("build/live-identity-catalog.json")
          output = Path("build/live-identity-evidence")
          output.mkdir(parents=True, exist_ok=True)
          key = os.environ["LS_IDENTITY_CATALOG_SECRET"].encode()
          catalog = load_signed_identity_catalog(catalog_path, secret=key)
          schema = json.loads(
              Path("schemas/trusted_runtime/identity_catalog.schema.json").read_text()
          )
          assert not list(
              Draft202012Validator(schema).iter_errors(catalog.to_dict())
          )
          assert len(catalog.entries) == 2

          api = SignedCatalogIdentityTimelineAPI(
              CatalogIdentityTimelineRepository(
                  root, catalog_path, secret=key
              )
          )
          requests = {
              "catalog.json": ("/api/v1/catalog", ""),
              "agents.json": ("/api/v1/agents", ""),
              "events-page-1.json": (
                  "/api/v1/agents/agent%3Alive-reviewer/events",
                  "limit=4",
              ),
              "events-page-2.json": (
                  "/api/v1/agents/agent%3Alive-reviewer/events",
                  "cursor=4&limit=4",
              ),
              "events-page-3.json": (
                  "/api/v1/agents/agent%3Alive-reviewer/events",
                  "cursor=8&limit=4",
              ),
          }
          for filename, (path, query) in requests.items():
              response = api.handle_live("GET", path, query_string=query)
              assert response[0] == 200
              (output / filename).write_bytes(response[2])

          pages = [
              json.loads((output / f"events-page-{index}.json").read_text())
              for index in (1, 2, 3)
          ]
          events = [item for page in pages for item in page["items"]]
          assert [item["sequence"] for item in events] == list(range(9))
          assert pages[-1]["next_cursor"] is None
          PY

      - name: Package repeatable viewer evidence
        if: matrix.python-version == '3.11'
        run: |
          mkdir -p build/live-identity-evidence/dashboard
          cp python/modules/trusted_runtime/identity_dashboard/index.html \
             python/modules/trusted_runtime/identity_dashboard/styles.css \
             python/modules/trusted_runtime/identity_dashboard/app.js \
             build/live-identity-evidence/dashboard/
          cp scripts/build_identity_catalog.py \
             scripts/serve_live_identity_viewer.py \
             build/live-identity-evidence/

      - name: Upload signed live catalog evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: signed-live-identity-catalog-evidence
          path: |
            build/live-identity-data
            build/live-identity-catalog.json
            build/live-identity-evidence
          if-no-files-found: error
