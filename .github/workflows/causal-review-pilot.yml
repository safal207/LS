name: Causal Review Pilot

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: causal-review-pilot-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pilot:
    name: Collect and report causal reviewer evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/causal-review-pilot')
        )
        || (
          github.event_name == 'pull_request_review'
          && startsWith(github.event.review.body, '/causal-review-pilot')
        )
      }}

    env:
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      OUTPUT_DIR: /tmp/causal-review-pilot
      DEEPSEEK_MODEL: deepseek/deepseek-r1

    steps:
      - name: Resolve trusted pilot command
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.eventName === 'pull_request_review'
              ? (context.payload.review || {})
              : (context.payload.comment || {});
            const association = source.author_association || 'NONE';
            const body = source.body || '';
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association);
            const command = body.trim().startsWith('/causal-review-pilot');
            const accepted = trusted && command;
            core.setOutput('accepted', String(accepted));
            if (!accepted) {
              core.notice(`Pilot command ignored: trusted=${trusted}, command=${command}, author_association=${association}`);
            }

      - name: Check out trusted default branch
        if: ${{ steps.request.outputs.accepted == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Collect exact GitHub evidence
        if: ${{ steps.request.outputs.accepted == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/github_causal_review_collector.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --output-dir "$OUTPUT_DIR"

      - name: Adapt CodeRabbit and Qodo threads
        if: ${{ steps.request.outputs.accepted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/causal_review_adapters.py adapt \
            "$OUTPUT_DIR/coderabbit-bundle.json" \
            --output "$OUTPUT_DIR/coderabbit-review.json"
          python tools/causal_review_adapters.py adapt \
            "$OUTPUT_DIR/qodo-bundle.json" \
            --output "$OUTPUT_DIR/qodo-review.json"

      - name: Record explicit DeepSeek NOT_RUN lane
        if: ${{ steps.request.outputs.accepted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_dir = Path(os.environ["OUTPUT_DIR"])
          manifest = json.loads(
              (output_dir / "collection-manifest.json").read_text(encoding="utf-8")
          )
          lane = {
              "schema_version": "ls.deepseek-causal-lane.v0.1",
              "target": manifest["target"],
              "model": {
                  "requested": os.environ["DEEPSEEK_MODEL"],
                  "provider": None,
              },
              "execution": {
                  "status": "NOT_RUN",
                  "provenance": "UNVERIFIED",
                  "details": (
                      "The trusted collector workflow does not hold a DeepSeek provider "
                      "credential. No DeepSeek model call was made."
                  ),
              },
              "findings": [],
              "dedupe_overrides": {},
              "tests_to_run": [],
              "human_decision_points": [],
          }
          (output_dir / "deepseek-lane.json").write_text(
              json.dumps(lane, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python tools/deepseek_causal_review_adapter.py \
            "$OUTPUT_DIR/deepseek-lane.json" \
            --output "$OUTPUT_DIR/deepseek-review.json"

      - name: Build provisional pilot report
        if: ${{ steps.request.outputs.accepted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/causal_review_pilot.py \
            --raw \
              "$OUTPUT_DIR/coderabbit-bundle.json" \
              "$OUTPUT_DIR/qodo-bundle.json" \
              "$OUTPUT_DIR/deepseek-lane.json" \
            --reviews \
              "$OUTPUT_DIR/coderabbit-review.json" \
              "$OUTPUT_DIR/qodo-review.json" \
              "$OUTPUT_DIR/deepseek-review.json" \
            --measurement-class PILOT \
            --output "$OUTPUT_DIR/pilot-report.json"

      - name: Upload exact pilot evidence
        if: ${{ always() && steps.request.outputs.accepted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: causal-review-pilot-pr-${{ env.PR_NUMBER }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Upsert provisional pilot comment
        if: ${{ always() && steps.request.outputs.accepted == 'true' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- causal-review-pilot -->';
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.PR_NUMBER);
            const reportPath = `${process.env.OUTPUT_DIR}/pilot-report.json`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            let body;
            if (!fs.existsSync(reportPath)) {
              body = `${marker}\n## 🧭 Causal review pilot — FAILED\n\nThe workflow did not produce a validated pilot report. No queue-reduction claim is available.\n\n- Workflow run: ${runUrl}`;
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const formatRate = value => value === null ? 'n/a' : `${(value * 100).toFixed(1)}%`;
              const target = report.target;
              const incomplete = report.incomplete_lanes.length
                ? report.incomplete_lanes.map(lane => `- \`${lane.provider}\`: ${lane.status} / ${lane.provenance}`).join('\n')
                : '_None_';
              body = `${marker}\n## 🧭 Causal review pilot — PROVISIONAL\n\n- Exact head: \`${target.head_sha}\`\n- Patch: \`${target.patch_sha256}\`\n- Raw findings: **${report.raw_finding_count}**\n- Evidence-bound findings: **${report.evidence_bound_count}**\n- Root-cause clusters: **${report.root_cause_cluster_count}**\n- Corroborated clusters: **${report.corroborated_cluster_count}**\n- Human adjudication items: **${report.adjudication_item_count}**\n- Provisional queue reduction: **${formatRate(report.human_queue_reduction)}**\n\n### Incomplete lanes\n${incomplete}\n\n⚠️ Human adjudication is pending. This report cannot approve, block, merge, or support a production noise-reduction claim.\n\n- Workflow run: ${runUrl}`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
