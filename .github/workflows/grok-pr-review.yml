name: Grok PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: grok-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  grok-review:
    name: Advisory Grok review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REVIEW_FILE: ${{ runner.temp }}/grok_review.md
      PATCH_FILE: ${{ runner.temp }}/pr.patch
      XAI_MODEL: grok-4.5
      PATCH_LIMIT_CHARS: "120000"

    steps:
      - name: Check xAI API key
        id: api_key
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Grok PR Review skipped"
              echo ""
              echo "Repository secret \`XAI_API_KEY\` is not configured yet."
              echo "Add it in: Settings → Secrets and variables → Actions → New repository secret."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Prepare PR patch
        if: ${{ steps.api_key.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --patch > "$PATCH_FILE"

          echo "Patch size: $(wc -c < "$PATCH_FILE") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Grok review via xAI API
        if: ${{ steps.api_key.outputs.available == 'true' }}
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          patch_path = pathlib.Path(os.environ["PATCH_FILE"])
          review_path = pathlib.Path(os.environ["REVIEW_FILE"])
          limit = int(os.environ.get("PATCH_LIMIT_CHARS", "120000"))
          patch = patch_path.read_text(encoding="utf-8", errors="replace")
          original_len = len(patch)
          if len(patch) > limit:
              patch = patch[:limit] + "\n\n[PATCH TRUNCATED FOR COST/CONTEXT LIMITS]"

          prompt = f"""
          You are an advisory pull-request reviewer for the LS project.

          Review the PR patch below as a strict senior QA engineer, code reviewer, and CI-risk analyst.

          Scope:
          - real bugs and regressions
          - broken edge cases
          - missing or weak tests
          - security/privacy risks
          - CI/release risks
          - unclear logic or requirements gaps

          Output format in Markdown:
          1. Verdict: APPROVE / COMMENT / REQUEST_CHANGES
          2. Risk level: low / medium / high
          3. Findings table with: ID, severity, file/path, evidence, recommendation
          4. Tests to add or run
          5. Human decision points

          Rules:
          - Be concrete and actionable.
          - Do not invent line numbers if the patch does not support them.
          - Do not request changes for style-only opinions.
          - Prefer COMMENT when evidence is uncertain.
          - Treat this as advisory only; do not attempt to modify files.

          PR PATCH:
          ```patch
          {patch}
          ```
          """.strip()

          payload = {
              "model": os.environ.get("XAI_MODEL", "grok-4.5"),
              "input": prompt,
          }

          request = urllib.request.Request(
              "https://api.x.ai/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['XAI_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=240) as response:
                  raw = response.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as exc:
              error_body = exc.read().decode("utf-8", errors="replace")
              print(f"xAI API HTTP {exc.code}", file=sys.stderr)
              print(error_body[:4000], file=sys.stderr)
              raise

          data = json.loads(raw)
          text = data.get("output_text")

          if not text:
              chunks = []
              for item in data.get("output", []) or []:
                  if not isinstance(item, dict):
                      continue
                  for content in item.get("content", []) or []:
                      if isinstance(content, dict) and "text" in content:
                          chunks.append(content.get("text") or "")
              text = "\n".join(chunks).strip()

          if not text:
              text = "_Grok response did not contain output_text. Raw response excerpt:_\n\n```json\n" + json.dumps(data, indent=2)[:10000] + "\n```"

          header = f"_Model: `{payload['model']}`. Patch chars: `{original_len}`; sent chars: `{len(patch)}`._\n\n"
          review_path.write_text(header + text, encoding="utf-8")
          print(f"Review written to {review_path}")
          PY

      - name: Truncate long review for GitHub comment
        if: ${{ steps.api_key.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          MAX_CHARS=58000
          if [ "$(wc -c < "$REVIEW_FILE")" -gt "$MAX_CHARS" ]; then
            head -c "$MAX_CHARS" "$REVIEW_FILE" > "$REVIEW_FILE.tmp"
            {
              echo ""
              echo "---"
              echo "Review was truncated because GitHub comments have a size limit. See workflow logs for full output."
            } >> "$REVIEW_FILE.tmp"
            mv "$REVIEW_FILE.tmp" "$REVIEW_FILE"
          fi

      - name: Upsert PR comment
        if: ${{ steps.api_key.outputs.available == 'true' }}
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ env.REVIEW_FILE }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- grok-pr-reviewer -->';
            const review = fs.readFileSync(process.env.REVIEW_FILE, 'utf8').trim();
            const [owner, repo] = context.repo.owner && context.repo.repo
              ? [context.repo.owner, context.repo.repo]
              : process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.PR_NUMBER);

            const body = `${marker}\n## 🤖 Grok PR Review — advisory\n\n${review || '_Grok returned an empty review._'}\n\n---\n_Mode: advisory only. This comment does not block merge._`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
