name: Grok PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: grok-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  grok-review:
    name: Advisory Grok review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REVIEW_FILE: /tmp/grok_review.md
      PATCH_FILE: /tmp/pr.patch
      PATCH_ERROR_FILE: /tmp/pr.patch.err
      XAI_MODEL: grok-latest
      PATCH_LIMIT_CHARS: "60000"

    steps:
      - name: Initialize diagnostic file
        timeout-minutes: 1
        run: |
          printf '%s\n\n%s\n' \
            '⚠️ Grok PR Review did not complete.' \
            'The workflow started but has not written a final result yet.' \
            > "$REVIEW_FILE"

      - name: Check xAI API key
        id: api_key
        timeout-minutes: 1
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '%s\n\n%s\n\n%s\n' \
              '⚠️ Grok PR Review skipped.' \
              'Repository secret `XAI_API_KEY` is not configured yet.' \
              'Add it in: Settings → Secrets and variables → Actions → New repository secret.' \
              > "$REVIEW_FILE"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Validate pull request input
        id: pr
        if: ${{ steps.api_key.outputs.available == 'true' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pr_json="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,isDraft,headRefName,baseRefName \
            2>"$PATCH_ERROR_FILE")"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            error_excerpt="$(head -c 4000 "$PATCH_ERROR_FILE" || true)"
            printf '%s\n\n%s\n\n```text\n%s\n```\n' \
              '⚠️ Could not validate PR input.' \
              "PR number \`$PR_NUMBER\` could not be loaded from \`$GITHUB_REPOSITORY\`." \
              "$error_excerpt" \
              > "$REVIEW_FILE"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "Validated PR: $pr_json" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare PR patch
        id: patch
        if: ${{ steps.api_key.outputs.available == 'true' && steps.pr.outputs.valid == 'true' }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh pr diff "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --patch > "$PATCH_FILE" 2> "$PATCH_ERROR_FILE"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            error_excerpt="$(head -c 4000 "$PATCH_ERROR_FILE" || true)"
            printf '%s\n\n%s\n\nExit code: `%s`\n\n```text\n%s\n```\n' \
              '⚠️ Could not prepare PR patch.' \
              "The \`gh pr diff\` command failed for PR \`$PR_NUMBER\`." \
              "$status" \
              "$error_excerpt" \
              > "$REVIEW_FILE"
            exit 0
          fi

          if [ ! -s "$PATCH_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '%s\n\n%s\n' \
              '⚠️ No patch content to review.' \
              "The patch for PR \`$PR_NUMBER\` was empty, so Grok was not called." \
              > "$REVIEW_FILE"
            echo "Patch size: 0 bytes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Patch size: $(wc -c < "$PATCH_FILE") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Grok review via xAI Chat API
        if: ${{ steps.api_key.outputs.available == 'true' && steps.pr.outputs.valid == 'true' && steps.patch.outputs.available == 'true' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import traceback
          import urllib.error
          import urllib.request

          patch_path = pathlib.Path(os.environ["PATCH_FILE"])
          review_path = pathlib.Path(os.environ["REVIEW_FILE"])
          limit = int(os.environ.get("PATCH_LIMIT_CHARS", "60000"))
          model = os.environ.get("XAI_MODEL", "grok-latest")

          def write_diagnostic(title, details):
              review_path.write_text(
                  f"⚠️ {title}\n\n{details}\n\n---\n_Mode: advisory diagnostic. This comment does not block merge._\n",
                  encoding="utf-8",
              )

          try:
              if not patch_path.exists():
                  write_diagnostic(
                      "Could not prepare PR patch.",
                      f"`{patch_path}` does not exist. The patch step probably failed for PR `{os.environ.get('PR_NUMBER')}`.",
                  )
                  raise SystemExit(0)

              if patch_path.stat().st_size == 0:
                  write_diagnostic(
                      "No patch content to review.",
                      f"The patch for PR `{os.environ.get('PR_NUMBER')}` was empty, so Grok was not called.",
                  )
                  raise SystemExit(0)

              patch = patch_path.read_text(encoding="utf-8", errors="replace")
              original_len = len(patch)
              if len(patch) > limit:
                  patch = patch[:limit] + "\n\n[PATCH TRUNCATED FOR COST/CONTEXT LIMITS]"

              system_prompt = """
              You are an advisory pull-request reviewer for the LS project.
              Act as a strict senior QA engineer, code reviewer, and CI-risk analyst.
              Return concise, concrete, actionable Markdown.
              Do not modify files. Do not invent evidence.
              """.strip()

              user_prompt = f"""
              Review this PR patch.

              Scope:
              - real bugs and regressions
              - broken edge cases
              - missing or weak tests
              - security/privacy risks
              - CI/release risks
              - unclear logic or requirements gaps

              Output format:
              1. Verdict: APPROVE / COMMENT / REQUEST_CHANGES
              2. Risk level: low / medium / high
              3. Findings table with: ID, severity, file/path, evidence, recommendation
              4. Tests to add or run
              5. Human decision points

              Rules:
              - Be concrete and actionable.
              - Do not invent line numbers if the patch does not support them.
              - Do not request changes for style-only opinions.
              - Prefer COMMENT when evidence is uncertain.

              PR PATCH:
              ```patch
              {patch}
              ```
              """.strip()

              payload = {
                  "model": model,
                  "messages": [
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": user_prompt},
                  ],
              }

              request = urllib.request.Request(
                  "https://api.x.ai/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {os.environ['XAI_API_KEY']}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=420) as response:
                      raw = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  error_body = exc.read().decode("utf-8", errors="replace")
                  write_diagnostic(
                      "Grok API call failed.",
                      f"Model attempted: `{model}`\n\nHTTP status: `{exc.code}`\n\n```text\n{error_body[:4000]}\n```",
                  )
                  raise SystemExit(0)

              data = json.loads(raw)
              text = (data.get("choices") or [{}])[0].get("message", {}).get("content", "").strip()
              if not text:
                  text = "_Grok response did not contain choices[0].message.content._\n\n```json\n" + json.dumps(data, indent=2)[:10000] + "\n```"

              header = f"_Model: `{model}`. Patch chars: `{original_len}`; sent chars: `{len(patch)}`._\n\n"
              review_path.write_text(header + text, encoding="utf-8")
              print(f"Review written to {review_path}")

          except Exception:
              write_diagnostic(
                  "Unexpected Grok reviewer error.",
                  "```text\n" + traceback.format_exc()[:4000] + "\n```",
              )
          PY

      - name: Ensure review file exists
        if: always()
        timeout-minutes: 1
        run: |
          if [ ! -s "$REVIEW_FILE" ]; then
            printf '%s\n\n%s\n' \
              '⚠️ Grok PR Review produced no output.' \
              'No review file was created. Check workflow logs for the failing step.' \
              > "$REVIEW_FILE"
          fi

      - name: Truncate long review for GitHub comment
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          MAX_CHARS=58000
          if [ "$(wc -c < "$REVIEW_FILE")" -gt "$MAX_CHARS" ]; then
            head -c "$MAX_CHARS" "$REVIEW_FILE" > "$REVIEW_FILE.tmp"
            {
              echo ""
              echo "---"
              echo "Review was truncated because GitHub comments have a size limit. See workflow logs for full output."
            } >> "$REVIEW_FILE.tmp"
            mv "$REVIEW_FILE.tmp" "$REVIEW_FILE"
          fi

      - name: Upsert PR comment
        if: always()
        timeout-minutes: 2
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ env.REVIEW_FILE }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- grok-pr-reviewer -->';
            const review = fs.readFileSync(process.env.REVIEW_FILE, 'utf8').trim();
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.PR_NUMBER);

            const body = `${marker}\n## 🤖 Grok PR Review — advisory\n\n${review || '_Grok returned an empty review._'}\n\n---\n_Mode: advisory only. This comment does not block merge._`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
