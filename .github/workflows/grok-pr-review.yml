name: Grok PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: grok-pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  grok-review:
    name: Advisory Grok review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/grok-review')
        )
      }}

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      REVIEW_FILE: /tmp/grok_review.md
      PATCH_FILE: /tmp/pr.patch
      PATCH_ERROR_FILE: /tmp/pr.patch.err
      XAI_MODEL: grok-4.5
      PATCH_LIMIT_CHARS: "60000"

    steps:
      - name: Resolve review request
        id: request
        timeout-minutes: 1
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const eventName = context.eventName;
            let accepted = true;
            let reason = '';
            let prNumber = process.env.PR_NUMBER || '';

            if (eventName === 'issue_comment') {
              const issue = context.payload.issue || {};
              const comment = context.payload.comment || {};
              const body = (comment.body || '').trim();
              const authorAssociation = comment.author_association || 'NONE';
              const actor = comment.user?.login || context.actor;
              const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(authorAssociation);
              prNumber = String(issue.number || prNumber || '');

              if (!issue.pull_request) {
                accepted = false;
                reason = 'The command was posted on an issue, not a pull request.';
              } else if (!body.startsWith('/grok-review')) {
                accepted = false;
                reason = 'The comment is not a /grok-review command.';
              } else if (!trusted) {
                accepted = false;
                reason = `The command author is not trusted for this repository. author_association=${authorAssociation}`;
              }

              const marker = '<!-- grok-review-command-ack -->';
              const status = accepted ? 'accepted' : 'ignored';
              const title = accepted ? 'Grok review command accepted' : 'Grok review command ignored';
              const details = accepted
                ? 'The advisory Grok review workflow accepted this command and will continue with PR validation, patch preparation, review generation, summary/artifact persistence, and best-effort comment publication.'
                : `Reason: ${reason}`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: Number(prNumber),
                body: `${marker}\n## 🤖 ${title}\n\nStatus: \`${status}\`\n\nTarget PR: #${prNumber}\nActor: @${actor}\nAuthor association: \`${authorAssociation}\`\nRun: \`${context.runId}\`\n\n${details}`,
              });
            }

            core.setOutput('accepted', String(accepted));
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('reason', reason);

            if (!accepted) {
              core.notice(`Grok review request ignored: ${reason}`);
            }

      - name: Initialize diagnostic file
        if: ${{ steps.request.outputs.accepted == 'true' }}
        timeout-minutes: 1
        run: |
          printf '%s\n\n%s\n' \
            '⚠️ Grok PR Review did not complete.' \
            'The workflow started but has not written a final result yet.' \
            > "$REVIEW_FILE"

      - name: Validate pull request input
        id: pr
        if: ${{ steps.request.outputs.accepted == 'true' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pr_json="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,isDraft,headRefName,baseRefName \
            2>"$PATCH_ERROR_FILE")"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            error_excerpt="$(head -c 4000 "$PATCH_ERROR_FILE" || true)"
            printf '%s\n\n%s\n\n```text\n%s\n```\n' \
              '⚠️ Could not validate PR input.' \
              "PR number \`$PR_NUMBER\` could not be loaded from \`$GITHUB_REPOSITORY\`." \
              "$error_excerpt" \
              > "$REVIEW_FILE"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "Validated PR: $pr_json" >> "$GITHUB_STEP_SUMMARY"

      - name: Check xAI API key
        id: api_key
        if: ${{ steps.request.outputs.accepted == 'true' && steps.pr.outputs.valid == 'true' }}
        timeout-minutes: 1
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '%s\n\n%s\n\n%s\n' \
              '⚠️ Grok PR Review skipped.' \
              'Repository secret `XAI_API_KEY` is not configured yet.' \
              'Add it in: Settings → Secrets and variables → Actions → New repository secret.' \
              > "$REVIEW_FILE"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Prepare PR patch
        id: patch
        if: ${{ steps.request.outputs.accepted == 'true' && steps.pr.outputs.valid == 'true' && steps.api_key.outputs.available == 'true' }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh pr diff "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --patch > "$PATCH_FILE" 2> "$PATCH_ERROR_FILE"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            error_excerpt="$(head -c 4000 "$PATCH_ERROR_FILE" || true)"
            printf '%s\n\n%s\n\nExit code: `%s`\n\n```text\n%s\n```\n' \
              '⚠️ Could not prepare PR patch.' \
              "The \`gh pr diff\` command failed for PR \`$PR_NUMBER\`." \
              "$status" \
              "$error_excerpt" \
              > "$REVIEW_FILE"
            exit 0
          fi

          if [ ! -s "$PATCH_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '%s\n\n%s\n' \
              '⚠️ No patch content to review.' \
              "The patch for PR \`$PR_NUMBER\` was empty, so Grok was not called." \
              > "$REVIEW_FILE"
            echo "Patch size: 0 bytes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Patch size: $(wc -c < "$PATCH_FILE") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Grok review via xAI Chat API
        if: ${{ steps.request.outputs.accepted == 'true' && steps.pr.outputs.valid == 'true' && steps.api_key.outputs.available == 'true' && steps.patch.outputs.available == 'true' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import traceback
          import urllib.error
          import urllib.request

          patch_path = pathlib.Path(os.environ["PATCH_FILE"])
          review_path = pathlib.Path(os.environ["REVIEW_FILE"])
          limit = int(os.environ.get("PATCH_LIMIT_CHARS", "60000"))
          model = os.environ.get("XAI_MODEL", "grok-4.5")

          def write_diagnostic(title, details):
              review_path.write_text(
                  f"⚠️ {title}\n\n{details}\n\n---\n_Mode: advisory diagnostic. This comment does not block merge._\n",
                  encoding="utf-8",
              )

          try:
              if not patch_path.exists():
                  write_diagnostic(
                      "Could not prepare PR patch.",
                      f"`{patch_path}` does not exist. The patch step probably failed for PR `{os.environ.get('PR_NUMBER')}`.",
                  )
                  raise SystemExit(0)

              patch = patch_path.read_text(encoding="utf-8", errors="replace")
              original_len = len(patch)
              if len(patch) > limit:
                  patch = patch[:limit] + "\n\n[PATCH TRUNCATED FOR COST/CONTEXT LIMITS]"

              system_prompt = """
              You are an advisory pull-request reviewer for the LS project.
              Act as a strict senior QA engineer, code reviewer, and CI-risk analyst.
              Return concise, concrete, actionable Markdown.
              Do not modify files. Do not invent evidence.
              """.strip()

              user_prompt = f"""
              Review this PR patch.

              Scope:
              - real bugs and regressions
              - broken edge cases
              - missing or weak tests
              - security/privacy risks
              - CI/release risks
              - unclear logic or requirements gaps

              Output format:
              1. Verdict: APPROVE / COMMENT / REQUEST_CHANGES
              2. Risk level: low / medium / high
              3. Findings table with: ID, severity, file/path, evidence, recommendation
              4. Tests to add or run
              5. Human decision points

              Rules:
              - Be concrete and actionable.
              - Do not invent line numbers if the patch does not support them.
              - Do not request changes for style-only opinions.
              - Prefer COMMENT when evidence is uncertain.

              PR PATCH:
              ```patch
              {patch}
              ```
              """.strip()

              payload = {
                  "model": model,
                  "messages": [
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": user_prompt},
                  ],
              }

              request = urllib.request.Request(
                  "https://api.x.ai/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {os.environ['XAI_API_KEY']}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=420) as response:
                      raw = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  error_body = exc.read().decode("utf-8", errors="replace")
                  write_diagnostic(
                      "Grok API call failed.",
                      f"Model attempted: `{model}`\n\nHTTP status: `{exc.code}`\n\n```text\n{error_body[:4000]}\n```",
                  )
                  raise SystemExit(0)

              data = json.loads(raw)
              text = (data.get("choices") or [{}])[0].get("message", {}).get("content", "").strip()
              if not text:
                  text = "_Grok response did not contain choices[0].message.content._\n\n```json\n" + json.dumps(data, indent=2)[:10000] + "\n```"

              header = f"_Model: `{model}`. Patch chars: `{original_len}`; sent chars: `{len(patch)}`._\n\n"
              review_path.write_text(header + text, encoding="utf-8")
              print(f"Review written to {review_path}")

          except Exception:
              write_diagnostic(
                  "Unexpected Grok reviewer error.",
                  "```text\n" + traceback.format_exc()[:4000] + "\n```",
              )
          PY

      - name: Ensure review file exists
        if: ${{ always() && steps.request.outputs.accepted == 'true' }}
        timeout-minutes: 1
        run: |
          if [ ! -s "$REVIEW_FILE" ]; then
            printf '%s\n\n%s\n' \
              '⚠️ Grok PR Review produced no output.' \
              'No review file was created. Check workflow logs for the failing step.' \
              > "$REVIEW_FILE"
          fi

      - name: Truncate long review for GitHub comment
        if: ${{ always() && steps.request.outputs.accepted == 'true' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          MAX_CHARS=58000
          if [ "$(wc -c < "$REVIEW_FILE")" -gt "$MAX_CHARS" ]; then
            head -c "$MAX_CHARS" "$REVIEW_FILE" > "$REVIEW_FILE.tmp"
            {
              echo ""
              echo "---"
              echo "Review was truncated because GitHub comments have a size limit. See workflow logs for full output."
            } >> "$REVIEW_FILE.tmp"
            mv "$REVIEW_FILE.tmp" "$REVIEW_FILE"
          fi

      - name: Write review to job summary
        if: ${{ always() && steps.request.outputs.accepted == 'true' }}
        timeout-minutes: 1
        run: |
          {
            echo "## Grok PR Review result"
            echo ""
            cat "$REVIEW_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Grok review artifact
        if: ${{ always() && steps.request.outputs.accepted == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: grok-pr-review-${{ env.PR_NUMBER }}
          path: ${{ env.REVIEW_FILE }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upsert PR comment
        if: ${{ always() && steps.request.outputs.accepted == 'true' && (github.event_name != 'workflow_dispatch' || steps.pr.outputs.valid == 'true') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ env.REVIEW_FILE }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- grok-pr-reviewer -->';
            const review = fs.readFileSync(process.env.REVIEW_FILE, 'utf8').trim();
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.PR_NUMBER);

            const body = `${marker}\n## 🤖 Grok PR Review — advisory\n\n${review || '_Grok returned an empty review._'}\n\n---\n_Mode: advisory only. This comment does not block merge._`;

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });

              const existing = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } catch (error) {
              const status = error.status || 'unknown';
              const message = error.message || String(error);
              core.warning(`Could not upsert Grok comment: ${status} ${message}`);
              await core.summary
                .addHeading('Grok PR Review comment was not posted')
                .addRaw('\n\nReview generation completed, but comment publication failed. The review is preserved in the workflow summary and artifact.\n\n')
                .addCodeBlock(`status: ${status}\nmessage: ${message}`, 'text')
                .write();
              return;
            }
