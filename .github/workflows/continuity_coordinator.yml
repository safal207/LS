name: Continuity Coordinator

on:
  push:
    branches:
      - "main"
      - "feat/continuity-coordinator-v0.1"
  pull_request:
    paths:
      - "python/modules/trusted_runtime/continuity_coordinator.py"
      - "python/tests/test_trusted_runtime_continuity_coordinator.py"
      - "schemas/trusted_runtime/continuity_assessment.schema.json"
      - "scripts/run_continuity_coordinator_demo.py"
      - "docs/CONTINUITY_COORDINATOR_V0_1.md"
      - ".github/workflows/continuity_coordinator.yml"

concurrency:
  group: continuity-coordinator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest ruff

      - name: Ruff continuity changes
        run: |
          ruff check \
            python/modules/trusted_runtime/continuity_coordinator.py \
            python/tests/test_trusted_runtime_continuity_coordinator.py \
            scripts/run_continuity_coordinator_demo.py

      - name: Run continuity tests
        run: |
          PYTHONPATH=.:python:python/modules \
            python -m pytest \
              python/tests/test_trusted_runtime_continuity_coordinator.py

      - name: Generate deterministic continuity artifacts
        run: |
          PYTHONPATH=.:python:python/modules \
            python scripts/run_continuity_coordinator_demo.py \
              --output build/continuity-coordinator

      - name: Verify safety boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/continuity-coordinator")
          summary = json.loads((root / "summary.json").read_text())
          assert summary["result"] == "PASS"
          decisions = {
              item["observation_id"]: item for item in summary["decisions"]
          }
          false_presence = decisions["observation:loss:false-presence"]
          assert false_presence["decision"] == "BLOCK_FALSE_PRESENCE"
          for item in decisions.values():
              assert item["stable_identity_update_allowed"] is False
              assert item["execution_authorized"] is False
          PY

      - name: Upload continuity evidence bundle
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: continuity-coordinator-evidence
          path: build/continuity-coordinator
          if-no-files-found: error
