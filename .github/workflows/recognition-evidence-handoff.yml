name: Recognition-to-Evidence handoff

on:
  pull_request:
    paths:
      - "spec/recognition-evidence-handoff-v0.1.md"
      - "fixtures/recognition-evidence-handoff/**"
      - "tools/validate_recognition_evidence_handoff_v0_1.py"
      - ".github/workflows/recognition-evidence-handoff.yml"
  push:
    branches:
      - main
    paths:
      - "spec/recognition-evidence-handoff-v0.1.md"
      - "fixtures/recognition-evidence-handoff/**"
      - "tools/validate_recognition_evidence_handoff_v0_1.py"
      - ".github/workflows/recognition-evidence-handoff.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate fixture JSON
        run: |
          for file in fixtures/recognition-evidence-handoff/*.json; do
            python -m json.tool "$file" > /dev/null
          done
      - name: Run handoff conformance
        run: python tools/validate_recognition_evidence_handoff_v0_1.py
      - name: Validate machine-readable report
        run: python -m json.tool artifacts/recognition-evidence-handoff-v0.1-result.json > /dev/null
