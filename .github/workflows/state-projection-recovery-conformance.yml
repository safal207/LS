name: State projection recovery conformance

on:
  pull_request:
    paths:
      - "ls-conformance/state_projection_recovery/**"
      - ".github/workflows/state-projection-recovery-conformance.yml"
  push:
    branches:
      - main
    paths:
      - "ls-conformance/state_projection_recovery/**"
      - ".github/workflows/state-projection-recovery-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic fixture tests
        run: python ls-conformance/state_projection_recovery/test_state_projection_recovery.py
      - name: Render redacted fixture report
        run: |
          python ls-conformance/state_projection_recovery/run_fixture.py \
            ls-conformance/state_projection_recovery/fixtures/cases.json \
            > state-projection-recovery-report.json
          python -m json.tool state-projection-recovery-report.json > /dev/null
      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: state-projection-recovery-report
          path: state-projection-recovery-report.json
          if-no-files-found: error
