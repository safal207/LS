name: Durable approval fixtures

on:
  pull_request:
    paths:
      - "spec/durable-approval-conformance-v0.*.md"
      - "docs/product/approval-integrity-30-second-demo.md"
      - "docs/product/review-decision-adapter-v0.1.md"
      - "fixtures/trusted-runtime/durable-approval/**"
      - "tools/demo_approval_integrity.py"
      - "tools/review_decision_adapter_v0_1.py"
      - "tools/test_review_decision_adapter_v0_1.py"
      - "tools/validate_durable_approval_v0_*.py"
      - "tools/test_durable_approval_v0_*.py"
      - ".github/workflows/durable-approval-fixtures.yml"
  push:
    branches:
      - main
    paths:
      - "spec/durable-approval-conformance-v0.*.md"
      - "docs/product/approval-integrity-30-second-demo.md"
      - "docs/product/review-decision-adapter-v0.1.md"
      - "fixtures/trusted-runtime/durable-approval/**"
      - "tools/demo_approval_integrity.py"
      - "tools/review_decision_adapter_v0_1.py"
      - "tools/test_review_decision_adapter_v0_1.py"
      - "tools/validate_durable_approval_v0_*.py"
      - "tools/test_durable_approval_v0_*.py"
      - ".github/workflows/durable-approval-fixtures.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate durable approval fixture v0.1
        run: |
          python tools/validate_durable_approval_v0_1.py \
            fixtures/trusted-runtime/durable-approval/pending_approval_not_missing_authority_v0.1.json \
            fixtures/trusted-runtime/durable-approval/envelope.schema.json \
            fixtures/trusted-runtime/durable-approval/event.schema.json
      - name: Run durable approval v0.1 negative controls
        run: python tools/test_durable_approval_v0_1.py
      - name: Verify LS Approval Integrity product demo
        run: python tools/demo_approval_integrity.py --check
      - name: Validate ReviewDecision adapter fixture
        run: python tools/review_decision_adapter_v0_1.py --check
      - name: Render ReviewDecision adapter demo
        run: python tools/review_decision_adapter_v0_1.py --demo
      - name: Run ReviewDecision adapter negative controls
        run: python tools/test_review_decision_adapter_v0_1.py
      - name: Validate durable approval lifecycle suite v0.2
        run: |
          python tools/validate_durable_approval_v0_2.py \
            --envelope-schema fixtures/trusted-runtime/durable-approval/envelope.schema.json \
            --event-schema fixtures/trusted-runtime/durable-approval/event.schema.json \
            fixtures/trusted-runtime/durable-approval/configured_policy_expiry_v0.2.json \
            fixtures/trusted-runtime/durable-approval/verified_context_invalidation_v0.2.json \
            fixtures/trusted-runtime/durable-approval/durable_state_loss_v0.2.json \
            fixtures/trusted-runtime/durable-approval/reconcile_in_doubt_committed_v0.2.json \
            fixtures/trusted-runtime/durable-approval/reconcile_in_doubt_failed_v0.2.json
      - name: Run durable approval v0.2 negative controls
        run: python tools/test_durable_approval_v0_2.py
