name: Phase 12.1 Regression Scan

on:
  pull_request:
    paths:
      - "python/modules/nca/**"
      - "python/tests/**"
      - "tests/**"
      - ".semgrep/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: phase12-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep pytest

      - name: Run DCP regression test
        run: |
          PYTHONPATH=. python -m pytest tests/test_context_propagation.py -q

      - name: Run Semgrep (all severities for report)
        run: |
          semgrep --config .semgrep/phase12_1_regression_scan.yml --severity INFO

      - name: Enforce BLOCKER findings only
        run: |
          semgrep --config .semgrep/phase12_1_regression_scan.yml --severity ERROR --error
