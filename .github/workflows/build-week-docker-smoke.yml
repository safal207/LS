name: Build Week Docker Smoke

on:
  pull_request:
    paths:
      - "Dockerfile.build-week"
      - ".dockerignore"
      - ".github/workflows/build-week-docker-smoke.yml"
      - "build-week/**"
      - "scripts/run_build_week_demo.sh"
      - "tools/build_week_trust_gate.py"
      - "tests/test_build_week_*.py"
  push:
    branches:
      - build-week-2026
    paths:
      - "Dockerfile.build-week"
      - ".dockerignore"
      - ".github/workflows/build-week-docker-smoke.yml"
      - "build-week/**"
      - "scripts/run_build_week_demo.sh"
      - "tools/build_week_trust_gate.py"
      - "tests/test_build_week_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Build judge image
        run: docker build --pull --file Dockerfile.build-week --tag ls-build-week:${{ github.sha }} .

      - name: Run demo and tests in clean container
        run: docker run --rm ls-build-week:${{ github.sha }}
