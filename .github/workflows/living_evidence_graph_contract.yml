name: Living evidence graph contract

on:
  pull_request:
    paths:
      - "scripts/multi_model_review/evidence_graph.py"
      - "scripts/multi_model_review/evidence_probes.py"
      - "python/tests/test_living_evidence_graph.py"
      - "python/tests/fixtures/living_evidence_pattern_specimen/**"
      - "spec/living-evidence-graph-v0.1.md"
      - ".github/workflows/living_evidence_graph_contract.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/multi_model_review/evidence_graph.py"
      - "scripts/multi_model_review/evidence_probes.py"
      - "python/tests/test_living_evidence_graph.py"
      - "python/tests/fixtures/living_evidence_pattern_specimen/**"
      - "spec/living-evidence-graph-v0.1.md"
      - ".github/workflows/living_evidence_graph_contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile living evidence graph
        run: python -m py_compile scripts/multi_model_review/evidence_graph.py scripts/multi_model_review/evidence_probes.py
      - name: Run deterministic structural-probe contract
        run: python -m unittest python/tests/test_living_evidence_graph.py -v
