name: Orientation triad conformance

on:
  push:
    paths:
      - "spec/orientation-triad-v0.1.md"
      - "schemas/orientation-triad-v0.1.schema.json"
      - "tools/evaluate_orientation_triad.py"
      - "tools/run_orientation_triad_fixtures.py"
      - "fixtures/orientation-triad/**"
      - ".github/workflows/orientation-triad-conformance.yml"
  pull_request:
    paths:
      - "spec/orientation-triad-v0.1.md"
      - "schemas/orientation-triad-v0.1.schema.json"
      - "tools/evaluate_orientation_triad.py"
      - "tools/run_orientation_triad_fixtures.py"
      - "fixtures/orientation-triad/**"
      - ".github/workflows/orientation-triad-conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install jsonschema==4.23.0
      - name: Run orientation triad conformance
        run: python tools/run_orientation_triad_fixtures.py schemas/orientation-triad-v0.1.schema.json fixtures/orientation-triad/mandatory-v0.1.json fixtures/orientation-triad/precedence-v0.1.json
