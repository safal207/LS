name: Grok PR Review Command Bus

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/grok-review-command.json

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: grok-review-command-bus-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  command-bus:
    name: Connector-safe Grok review command
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository
        && startsWith(github.event.pull_request.head.ref, 'ci/grok-review-command')
      }}

    env:
      COMMAND_FILE: .github/grok-review-command.json
      REVIEW_FILE: /tmp/grok_review.md
      PATCH_FILE: /tmp/pr.patch
      PATCH_ERROR_FILE: /tmp/pr.patch.err
      XAI_MODEL: grok-latest
      PATCH_LIMIT_CHARS: "60000"
      SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
      COMMAND_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Load command file from PR head
        id: load
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p "$(dirname "$COMMAND_FILE")"
          last_error=""

          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$COMMAND_FILE?ref=$COMMAND_HEAD_SHA" \
              --jq .content > /tmp/grok_command_file.b64 2> /tmp/grok_command_file.err
            status=$?
            if [ "$status" -eq 0 ]; then
              base64 -d /tmp/grok_command_file.b64 > "$COMMAND_FILE" 2> /tmp/grok_command_decode.err
              decode_status=$?
              if [ "$decode_status" -eq 0 ] && [ -s "$COMMAND_FILE" ]; then
                echo "loaded=true" >> "$GITHUB_OUTPUT"
                echo "reason=" >> "$GITHUB_OUTPUT"
                echo "Loaded command file from PR head $COMMAND_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              last_error="decode_failed: $(head -c 1000 /tmp/grok_command_decode.err 2>/dev/null || true)"
            else
              last_error="gh_api_failed: $(head -c 1000 /tmp/grok_command_file.err 2>/dev/null || true)"
            fi
            sleep 2
          done

          echo "loaded=false" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<EOF"
            echo "$last_error"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n\n%s\n\n```text\n%s\n```\n' \
            '⚠️ Grok command bus could not load command file.' \
            "The workflow could not load \`$COMMAND_FILE\` from PR head \`$COMMAND_HEAD_SHA\`." \
            "$last_error" \
            > "$REVIEW_FILE"
          exit 0

      - name: Resolve command
        id: command
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          command_file = pathlib.Path(os.environ["COMMAND_FILE"])
          output_file = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          summary_file = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])

          def out(key, value):
              with output_file.open("a", encoding="utf-8") as fh:
                  fh.write(f"{key}={value}\n")

          def out_multiline(key, value):
              with output_file.open("a", encoding="utf-8") as fh:
                  fh.write(f"{key}<<EOF\n{value}\nEOF\n")

          def summary(text):
              with summary_file.open("a", encoding="utf-8") as fh:
                  fh.write(text + "\n")

          def reject(reason, detail=""):
              out("accepted", "false")
              out("target_pr", "")
              out("nonce", "")
              out("requested_by", "")
              out("reason", reason)
              out_multiline("detail", detail)
              summary(f"Command rejected: `{reason}`")
              if detail:
                  summary("")
                  summary(detail[:1000])
              sys.exit(0)

          if not command_file.exists():
              reject("command_file_missing", "Command file was not available after the load step.")

          try:
              data = json.loads(command_file.read_text(encoding="utf-8"))
          except Exception as exc:
              reject("invalid_json", str(exc))

          command = data.get("command")
          target_pr = data.get("target_pr")
          nonce = str(data.get("nonce", ""))[:160]
          requested_by = str(data.get("requested_by", "connector"))[:160]

          if command != "grok-review":
              reject("unsupported_command", f"Unsupported command: {command!r}")
          if not isinstance(target_pr, int) or target_pr <= 0:
              reject("invalid_target_pr", "`target_pr` must be a positive integer.")
          if not nonce:
              reject("missing_nonce", "`nonce` is required for idempotent command processing.")

          out("accepted", "true")
          out("target_pr", str(target_pr))
          out("nonce", nonce)
          out("requested_by", requested_by)
          out("reason", "")
          out_multiline("detail", "")
          summary("## Grok command accepted")
          summary("")
          summary(f"Target PR: `#{target_pr}`")
          summary(f"Requested by: `{requested_by}`")
          summary(f"Nonce: `{nonce}`")
          PY

      - name: Publish source diagnostic
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@v7
        env:
          SOURCE_PR_NUMBER: ${{ env.SOURCE_PR_NUMBER }}
          COMMAND_HEAD_SHA: ${{ env.COMMAND_HEAD_SHA }}
          LOADED: ${{ steps.load.outputs.loaded }}
          LOAD_REASON: ${{ steps.load.outputs.reason }}
          ACCEPTED: ${{ steps.command.outputs.accepted }}
          REASON: ${{ steps.command.outputs.reason }}
          DETAIL: ${{ steps.command.outputs.detail }}
          TARGET_PR: ${{ steps.command.outputs.target_pr }}
          NONCE: ${{ steps.command.outputs.nonce }}
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.SOURCE_PR_NUMBER);
            const marker = 'grok-review-command-bus-source-diagnostic';
            const nonce = process.env.NONCE || 'none';
            const status = process.env.ACCEPTED === 'true' ? 'accepted' : 'rejected';
            const body = `## 🧭 Grok command bus source diagnostic\n\nMarker: \`${marker}\`\nStatus: \`${status}\`\nSource PR: #${issue_number}\nTarget PR: ${process.env.TARGET_PR ? `#${process.env.TARGET_PR}` : '`unresolved`'}\nNonce: \`${nonce}\`\nCommand head: \`${process.env.COMMAND_HEAD_SHA || ''}\`\nLoaded: \`${process.env.LOADED || 'false'}\`\nReason: \`${process.env.REASON || process.env.LOAD_REASON || ''}\`\nRun: \`${context.runId}\`\n\n${process.env.DETAIL ? `\`\`\`text\n${process.env.DETAIL.slice(0, 4000)}\n\`\`\`` : '_No additional diagnostic detail._'}\n\n---\n_Mode: source-level diagnostic. Target PR acknowledgement is posted only after command resolution._`;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(`Marker: \`${marker}\``) && comment.body?.includes(`Nonce: \`${nonce}\``));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Validate target pull request
        id: pr
        if: ${{ steps.command.outputs.accepted == 'true' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.command.outputs.target_pr }}
        run: |
          set +e
          pr_json="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,isDraft,headRefName,baseRefName,headRefOid,baseRefOid,url \
            2>"$PATCH_ERROR_FILE")"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            error_excerpt="$(head -c 4000 "$PATCH_ERROR_FILE" || true)"
            printf '%s\n\n%s\n\n```text\n%s\n```\n' \
              '⚠️ Grok command bus could not validate target PR.' \
              "Target PR \`$PR_NUMBER\` could not be loaded from \`$GITHUB_REPOSITORY\`." \
              "$error_excerpt" \
              > "$REVIEW_FILE"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "Validated PR: $pr_json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert target acknowledgement
        if: ${{ always() && steps.command.outputs.accepted == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.command.outputs.target_pr }}
          NONCE: ${{ steps.command.outputs.nonce }}
          REQUESTED_BY: ${{ steps.command.outputs.requested_by }}
          VALID: ${{ steps.pr.outputs.valid }}
          SOURCE_PR_NUMBER: ${{ env.SOURCE_PR_NUMBER }}
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.PR_NUMBER);
            const valid = process.env.VALID === 'true';
            const marker = 'grok-review-command-bus-ack';
            const status = valid ? 'accepted' : 'invalid-target';
            const body = `## 🤖 Grok command bus acknowledgement\n\nMarker: \`${marker}\`\nStatus: \`${status}\`\nTarget PR: #${issue_number}\nSource command PR: #${process.env.SOURCE_PR_NUMBER}\nRequested by: \`${process.env.REQUESTED_BY || 'connector'}\`\nNonce: \`${process.env.NONCE || ''}\`\nRun: \`${context.runId}\`\n\n${valid ? 'The pull_request command bus accepted this request and will continue with patch preparation and advisory Grok review.' : 'The command bus received the request, but target PR validation did not pass.'}`;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(`Marker: \`${marker}\``) && comment.body?.includes(`Nonce: \`${process.env.NONCE || ''}\``));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Check xAI API key
        id: api_key
        if: ${{ steps.command.outputs.accepted == 'true' && steps.pr.outputs.valid == 'true' }}
        timeout-minutes: 1
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '%s\n\n%s\n\n%s\n' \
              '⚠️ Grok PR Review skipped.' \
              'Repository secret `XAI_API_KEY` is not configured yet.' \
              'Add it in: Settings → Secrets and variables → Actions → New repository secret.' \
              > "$REVIEW_FILE"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Prepare PR patch
        id: patch
        if: ${{ steps.command.outputs.accepted == 'true' && steps.pr.outputs.valid == 'true' && steps.api_key.outputs.available == 'true' }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.command.outputs.target_pr }}
        run: |
          set +e
          gh pr diff "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --patch > "$PATCH_FILE" 2> "$PATCH_ERROR_FILE"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            error_excerpt="$(head -c 4000 "$PATCH_ERROR_FILE" || true)"
            printf '%s\n\n%s\n\nExit code: `%s`\n\n```text\n%s\n```\n' \
              '⚠️ Could not prepare PR patch.' \
              "The \`gh pr diff\` command failed for PR \`$PR_NUMBER\`." \
              "$status" \
              "$error_excerpt" \
              > "$REVIEW_FILE"
            exit 0
          fi

          if [ ! -s "$PATCH_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '%s\n\n%s\n' \
              '⚠️ No patch content to review.' \
              "The patch for PR \`$PR_NUMBER\` was empty, so Grok was not called." \
              > "$REVIEW_FILE"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Patch size: $(wc -c < "$PATCH_FILE") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Grok review via xAI Chat API
        if: ${{ steps.command.outputs.accepted == 'true' && steps.pr.outputs.valid == 'true' && steps.api_key.outputs.available == 'true' && steps.patch.outputs.available == 'true' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PR_NUMBER: ${{ steps.command.outputs.target_pr }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import traceback
          import urllib.error
          import urllib.request

          patch_path = pathlib.Path(os.environ["PATCH_FILE"])
          review_path = pathlib.Path(os.environ["REVIEW_FILE"])
          limit = int(os.environ.get("PATCH_LIMIT_CHARS", "60000"))
          model = os.environ.get("XAI_MODEL", "grok-latest")

          def write_diagnostic(title, details):
              review_path.write_text(
                  f"⚠️ {title}\n\n{details}\n\n---\n_Mode: advisory diagnostic. This comment does not block merge._\n",
                  encoding="utf-8",
              )

          try:
              patch = patch_path.read_text(encoding="utf-8", errors="replace")
              original_len = len(patch)
              if len(patch) > limit:
                  patch = patch[:limit] + "\n\n[PATCH TRUNCATED FOR COST/CONTEXT LIMITS]"

              system_prompt = """
              You are an advisory pull-request reviewer for the LS project.
              Act as a strict senior QA engineer, code reviewer, and CI-risk analyst.
              Return concise, concrete, actionable Markdown.
              Do not modify files. Do not invent evidence.
              """.strip()

              user_prompt = f"""
              Review PR #{os.environ.get('PR_NUMBER')} from this patch.

              Scope:
              - real bugs and regressions
              - broken edge cases
              - missing or weak tests
              - security/privacy risks
              - CI/release risks
              - unclear logic or requirements gaps

              Output format:
              1. Verdict: APPROVE / COMMENT / REQUEST_CHANGES
              2. Risk level: low / medium / high
              3. Findings table with: ID, severity, file/path, evidence, recommendation
              4. Tests to add or run
              5. Human decision points

              Rules:
              - Be concrete and actionable.
              - Do not invent line numbers if the patch does not support them.
              - Do not request changes for style-only opinions.
              - Prefer COMMENT when evidence is uncertain.

              PR PATCH:
              ```patch
              {patch}
              ```
              """.strip()

              payload = {"model": model, "messages": [{"role": "system", "content": system_prompt}, {"role": "user", "content": user_prompt}]}
              request = urllib.request.Request(
                  "https://api.x.ai/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Authorization": f"Bearer {os.environ['XAI_API_KEY']}", "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=420) as response:
                      raw = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  error_body = exc.read().decode("utf-8", errors="replace")
                  write_diagnostic("Grok API call failed.", f"Model attempted: `{model}`\n\nHTTP status: `{exc.code}`\n\n```text\n{error_body[:4000]}\n```")
                  raise SystemExit(0)

              data = json.loads(raw)
              text = (data.get("choices") or [{}])[0].get("message", {}).get("content", "").strip()
              if not text:
                  text = "_Grok response did not contain choices[0].message.content._"
              review_path.write_text(f"_Model: `{model}`. Patch chars: `{original_len}`; sent chars: `{len(patch)}`._\n\n" + text, encoding="utf-8")
          except Exception:
              write_diagnostic("Unexpected Grok reviewer error.", "```text\n" + traceback.format_exc()[:4000] + "\n```")
          PY

      - name: Ensure review file exists
        if: ${{ always() && steps.command.outputs.accepted == 'true' }}
        timeout-minutes: 1
        run: |
          if [ ! -s "$REVIEW_FILE" ]; then
            printf '%s\n\n%s\n' \
              '⚠️ Grok command bus produced no review output.' \
              'No review file was created. Check workflow logs for the failing step.' \
              > "$REVIEW_FILE"
          fi

      - name: Write review to job summary
        if: ${{ always() && steps.command.outputs.accepted == 'true' }}
        timeout-minutes: 1
        run: |
          {
            echo "## Grok command bus review result"
            echo ""
            cat "$REVIEW_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert target review result
        if: ${{ always() && steps.command.outputs.accepted == 'true' && steps.pr.outputs.valid == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ env.REVIEW_FILE }}
          PR_NUMBER: ${{ steps.command.outputs.target_pr }}
          NONCE: ${{ steps.command.outputs.nonce }}
          SOURCE_PR_NUMBER: ${{ env.SOURCE_PR_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const marker = 'grok-review-command-bus-result';
            const review = fs.readFileSync(process.env.REVIEW_FILE, 'utf8').trim();
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.PR_NUMBER);
            const body = `## 🤖 Grok PR Review Command Bus — advisory\n\nMarker: \`${marker}\`\nNonce: \`${process.env.NONCE || ''}\`\nSource command PR: #${process.env.SOURCE_PR_NUMBER}\nRun: \`${context.runId}\`\n\n${review || '_Grok returned an empty review._'}\n\n---\n_Mode: advisory only. This comment does not block merge._`;
            try {
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
              const existing = comments.find((comment) => comment.body?.includes(`Marker: \`${marker}\``) && comment.body?.includes(`Nonce: \`${process.env.NONCE || ''}\``));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (error) {
              core.warning(`Could not publish command bus result: ${error.status || 'unknown'} ${error.message || error}`);
            }
