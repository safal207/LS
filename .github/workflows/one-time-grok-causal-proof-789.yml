name: One-time Grok causal proof for PR 789

on:
  pull_request_target:
    types: [opened, labeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: one-time-grok-causal-proof-789
  cancel-in-progress: false

jobs:
  causal-proof:
    name: Trusted causal proof
    if: >-
      ${{
        (
          github.event.action == 'opened'
          && github.event.pull_request.title == 'ci: trigger causal proof for PR 789'
        )
        || (
          github.event.action == 'labeled'
          && github.event.pull_request.number == 789
          && github.event.label.name == 'agent-runtime'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: "789"
      XAI_MODEL: grok-4.5
      PATCH_LIMIT_CHARS: "60000"
      PATCH_FILE: /tmp/causal-review.patch
      CAUSAL_PROMPT_FILE: .github/prompts/causal-review-v0.1.md
      RAW_RESPONSE_FILE: /tmp/causal-review.raw.txt
      REVIEW_JSON_FILE: /tmp/causal-review.json
      REVIEW_MD_FILE: /tmp/causal-review.md
      TARGET_ENV_FILE: /tmp/causal-review-target.env

    steps:
      - name: Announce trusted proof run
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const marker = '<!-- grok-causal-proof-789-status -->';
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.PR_NUMBER);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `${marker}\n## 🧭 Trusted Grok causal proof — STARTED\n\n- Workflow run: ${runUrl}\n- Trusted base commit: \`${process.env.GITHUB_SHA}\`\n- Review target: #${issue_number}\n\n_No review evidence is claimed until the validated result artifact is published._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Freeze exact review target and patch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          before_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,headRefOid)"
          state="$(jq -r '.state' <<<"$before_json")"
          draft="$(jq -r '.isDraft' <<<"$before_json")"
          before_sha="$(jq -r '.headRefOid' <<<"$before_json")"

          test "$state" = "OPEN"
          test "$draft" = "false"
          [[ "$before_sha" =~ ^[0-9a-f]{40}$ ]]

          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --patch > "$PATCH_FILE"
          test -s "$PATCH_FILE"

          after_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$before_sha" = "$after_sha"

          patch_hex="$(sha256sum "$PATCH_FILE" | awk '{print $1}')"
          patch_digest="sha256:${patch_hex}"

          {
            printf 'export TARGET_REPOSITORY=%q\n' "$GITHUB_REPOSITORY"
            printf 'export TARGET_PR_NUMBER=%q\n' "$PR_NUMBER"
            printf 'export TARGET_HEAD_SHA=%q\n' "$before_sha"
            printf 'export TARGET_PATCH_SHA256=%q\n' "$patch_digest"
          } > "$TARGET_ENV_FILE"

          echo "head_sha=$before_sha" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$patch_digest" >> "$GITHUB_OUTPUT"

      - name: Check xAI key
        id: api_key
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$XAI_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record NOT_RUN when key is absent
        if: ${{ steps.api_key.outputs.available != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source "$TARGET_ENV_FILE"
          python tools/grok_causal_review.py diagnostic \
            --status NOT_RUN \
            --provenance UNVERIFIED \
            --details "Repository secret XAI_API_KEY is unavailable. No model call was made."

      - name: Run trusted Grok causal review
        if: ${{ steps.api_key.outputs.available == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          source "$TARGET_ENV_FILE"
          python tools/grok_causal_review.py review

      - name: Recheck exact head before publication
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source "$TARGET_ENV_FILE"
          current_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"

          if [[ "$current_sha" != "$TARGET_HEAD_SHA" ]] \
            && [[ -s "$REVIEW_JSON_FILE" ]] \
            && jq -e '.execution.status == "COMPLETED" and .execution.provenance == "MATCHED"' "$REVIEW_JSON_FILE" >/dev/null; then
            python tools/grok_causal_review.py diagnostic \
              --status DIAGNOSTIC \
              --provenance MATCHED \
              --details "The PR head changed before publication. Reviewed $TARGET_HEAD_SHA; current $current_sha. Completed findings were discarded."
          fi

      - name: Ensure artifacts exist
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          source "$TARGET_ENV_FILE"
          if [[ ! -s "$REVIEW_JSON_FILE" || ! -s "$REVIEW_MD_FILE" ]]; then
            python tools/grok_causal_review.py diagnostic \
              --status FAILED \
              --provenance UNVERIFIED \
              --details "The trusted proof ended without a complete causal artifact."
          fi
          [[ -e "$RAW_RESPONSE_FILE" ]] || : > "$RAW_RESPONSE_FILE"

      - name: Upload proof artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: grok-causal-proof-pr-789
          path: |
            ${{ env.REVIEW_JSON_FILE }}
            ${{ env.REVIEW_MD_FILE }}
            ${{ env.RAW_RESPONSE_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish proof comment
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          REVIEW_MD_FILE: ${{ env.REVIEW_MD_FILE }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- grok-causal-proof-789 -->';
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.PR_NUMBER);
            const review = fs.readFileSync(process.env.REVIEW_MD_FILE, 'utf8').trim();
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `${marker}\n## 🧭 Trusted Grok causal proof\n\n${review}\n\n- Workflow run: ${runUrl}\n\n---\n_One-time production proof. Advisory only._`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
