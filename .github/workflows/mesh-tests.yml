name: mesh-tests

on:
  push:
    paths:
      - 'agent/**'
      - 'python/modules/web4_mesh/**'
      - 'python/modules/shared/config_loader.py'
      - 'python/tests/test_web4_mesh*.py'
      - 'tests/test_service_runtime.py'
      - 'tools/run_mesh_ws.py'
      - 'requirements-dev.txt'
      - '.github/workflows/mesh-tests.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'python/modules/web4_mesh/**'
      - 'python/modules/shared/config_loader.py'
      - 'python/tests/test_web4_mesh*.py'
      - 'tests/test_service_runtime.py'
      - 'tools/run_mesh_ws.py'
      - 'requirements-dev.txt'
      - '.github/workflows/mesh-tests.yml'

jobs:
  mesh-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      LIMINALQA_URL: ${{ secrets.LIMINALQA_URL }}
      LIMINALQA_TOKEN: ${{ secrets.LIMINALQA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-timeout pyyaml websockets
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
      - name: Run mesh/runtime tests
        uses: ./.github/actions/run-pytest-liminalqa
        with:
          liminalqa-plan: mesh-runtime
          pytest-invocation: >-
            PYTHONPATH=python pytest -q
            tests/test_service_runtime.py
            python/tests/test_web4_mesh.py
            python/tests/test_web4_mesh_node.py
            python/tests/test_web4_mesh_transport_ws.py
            --junitxml=artifacts/mesh-junit.xml
            --cov=agent
            --cov=python/modules/web4_mesh
            --cov-report=xml:artifacts/coverage.xml
            --timeout=30
      - name: Summarize quality artifacts
        if: always()
        uses: ./.github/actions/summarize-quality-artifacts
        with:
          label: mesh-tests
      - id: quality_gate
        name: Quality gate
        if: always()
        uses: ./.github/actions/quality-gate
        with:
          label: mesh-tests
          max-failures: "0"
          min-line-coverage: "30"
          require-junit: "true"
          require-coverage: "true"
          enforce: "true"
      - name: Update PR quality comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          GATE_VERDICT: ${{ steps.quality_gate.outputs.verdict }}
          GATE_TOTAL_FAILURES: ${{ steps.quality_gate.outputs.total-failures }}
          GATE_MIN_COVERAGE: ${{ steps.quality_gate.outputs.min-line-coverage-observed }}
        with:
          script: |
            const marker = '<!-- quality-gate:mesh-tests -->';
            const coverage = process.env.GATE_MIN_COVERAGE
              ? `${Number(process.env.GATE_MIN_COVERAGE).toFixed(1)}%`
              : 'n/a';
            const body = [
              marker,
              '### Mesh Tests Quality Gate',
              '',
              `- verdict: \`${process.env.GATE_VERDICT || 'unknown'}\``,
              `- failures+errors: \`${process.env.GATE_TOTAL_FAILURES || 'n/a'}\``,
              `- min line coverage observed: \`${coverage}\``,
              '- threshold: `30%`',
              '',
              `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-test-artifacts
          path: artifacts/
