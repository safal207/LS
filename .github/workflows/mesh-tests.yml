name: mesh-tests

on:
  push:
    paths:
      - 'agent/**'
      - 'python/modules/web4_mesh/**'
      - 'python/modules/shared/config_loader.py'
      - 'python/tests/test_web4_mesh*.py'
      - 'tests/test_service_runtime.py'
      - 'tools/run_mesh_ws.py'
      - 'requirements-dev.txt'
      - '.github/workflows/mesh-tests.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'python/modules/web4_mesh/**'
      - 'python/modules/shared/config_loader.py'
      - 'python/tests/test_web4_mesh*.py'
      - 'tests/test_service_runtime.py'
      - 'tools/run_mesh_ws.py'
      - 'requirements-dev.txt'
      - '.github/workflows/mesh-tests.yml'

jobs:
  mesh-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install pytest pytest-cov pytest-timeout pyyaml websockets
          fi
      - name: Create artifacts dir
        run: mkdir -p artifacts
      - name: Run mesh/runtime tests
        env:
          PYTHONPATH: python
        run: |
          pytest -q             tests/test_service_runtime.py             python/tests/test_web4_mesh.py             python/tests/test_web4_mesh_node.py             python/tests/test_web4_mesh_transport_ws.py             --junitxml=artifacts/mesh-junit.xml             --cov=agent             --cov=python/modules/web4_mesh             --cov-report=xml:artifacts/coverage.xml             --timeout=30
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-test-artifacts
          path: artifacts/
