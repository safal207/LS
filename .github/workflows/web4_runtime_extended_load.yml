name: Web4 Runtime Extended Load

on:
  workflow_dispatch:
    inputs:
      phase4_duration_s:
        description: "Phase 4 soak duration in seconds"
        required: false
        default: "120"
      sessions:
        description: "Number of sessions for phase3/phase4 runs"
        required: false
        default: "20"
      target_messages_per_s:
        description: "Target aggregate throughput for phase4"
        required: false
        default: "200"
  schedule:
    - cron: "30 3 * * *"
  pull_request:
    branches:
      - "main"
    paths:
      - "python/modules/web4_runtime/**"
      - "python/tests/test_web4_runtime_loadtest.py"
      - "python/tests/test_fuzzy_runtime.py"
      - "scripts/web4_runtime_load.py"
      - ".github/workflows/web4_runtime_extended_load.yml"

jobs:
  phase3-chaos:
    runs-on: ubuntu-latest
    env:
      RUN_SESSIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sessions || github.event_name == 'pull_request' && '8' || '20' }}
      PHASE3_MESSAGES_PER_SESSION: ${{ github.event_name == 'pull_request' && '60' || '120' }}
      PHASE3_MAX_QUEUE: ${{ github.event_name == 'pull_request' && '32' || '64' }}
      PHASE3_TOTAL_LIMIT: ${{ github.event_name == 'pull_request' && '256' || '768' }}
      PHASE3_PER_SESSION_LIMIT: ${{ github.event_name == 'pull_request' && '32' || '64' }}
      PHASE3_BURST_SIZE: ${{ github.event_name == 'pull_request' && '12' || '24' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run phase3 chaos profile
        run: |
          PYTHONPATH=python:python/modules python scripts/web4_runtime_load.py \
            --phase phase3 \
            --mode both \
            --sessions "${RUN_SESSIONS}" \
            --messages-per-session "${PHASE3_MESSAGES_PER_SESSION}" \
            --max-queue "${PHASE3_MAX_QUEUE}" \
            --total-limit "${PHASE3_TOTAL_LIMIT}" \
            --per-session-limit "${PHASE3_PER_SESSION_LIMIT}" \
            --chaos-disconnect-rate 0.12 \
            --burst-probability 0.2 \
            --burst-size "${PHASE3_BURST_SIZE}" \
            --gc-pressure

  phase4-soak:
    runs-on: ubuntu-latest
    needs: phase3-chaos
    env:
      RUN_SESSIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sessions || github.event_name == 'pull_request' && '8' || '20' }}
      PHASE4_MAX_QUEUE: ${{ github.event_name == 'pull_request' && '32' || '64' }}
      PHASE4_TOTAL_LIMIT: ${{ github.event_name == 'pull_request' && '256' || '768' }}
      PHASE4_PER_SESSION_LIMIT: ${{ github.event_name == 'pull_request' && '32' || '64' }}
      PHASE4_DURATION_S: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.phase4_duration_s || github.event_name == 'pull_request' && '20' || '120' }}
      TARGET_MESSAGES_PER_S: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_messages_per_s || github.event_name == 'pull_request' && '160' || '200' }}
      PHASE4_BURST_SIZE: ${{ github.event_name == 'pull_request' && '10' || '16' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run phase4 soak profile
        run: |
          PYTHONPATH=python:python/modules python scripts/web4_runtime_load.py \
            --phase phase4 \
            --mode both \
            --sessions "${RUN_SESSIONS}" \
            --max-queue "${PHASE4_MAX_QUEUE}" \
            --total-limit "${PHASE4_TOTAL_LIMIT}" \
            --per-session-limit "${PHASE4_PER_SESSION_LIMIT}" \
            --soak-duration-s "${PHASE4_DURATION_S}" \
            --target-messages-per-s "${TARGET_MESSAGES_PER_S}" \
            --chaos-disconnect-rate 0.08 \
            --burst-probability 0.15 \
            --burst-size "${PHASE4_BURST_SIZE}"
