name: Authorization Decision Gate

on:
  push:
    branches: [main, "feat/authorization-gate"]
  pull_request:
    paths:
      - "python/modules/trusted_runtime/authorization_contract.py"
      - "python/modules/trusted_runtime/authorization_decision_gate.py"
      - "python/modules/trusted_runtime/authorization_evidence_adapters.py"
      - "python/modules/trusted_runtime/capabilities_constraints_track_center.py"
      - "python/modules/trusted_runtime/roles_permissions_track_center.py"
      - "python/tests/test_trusted_runtime_authorization_decision_gate.py"
      - "python/tests/test_trusted_runtime_authorization_evidence_adapters.py"
      - "python/tests/test_authorization_negative_scope.py"
      - "python/tests/test_authorization_adapter_current_claims.py"
      - "schemas/trusted_runtime/authorization_request.schema.json"
      - "schemas/trusted_runtime/authorization_result.schema.json"
      - "scripts/run_authorization_decision_gate_demo.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install jsonschema pytest ruff
      - name: Ruff
        run: |
          ruff check python/modules/trusted_runtime/authorization_contract.py \
            python/modules/trusted_runtime/authorization_decision_gate.py \
            python/modules/trusted_runtime/authorization_evidence_adapters.py \
            python/tests/test_trusted_runtime_authorization_decision_gate.py \
            python/tests/test_trusted_runtime_authorization_evidence_adapters.py \
            python/tests/test_authorization_negative_scope.py \
            python/tests/test_authorization_adapter_current_claims.py \
            scripts/run_authorization_decision_gate_demo.py
      - name: Dependency center regressions
        run: |
          PYTHONPATH=.:python:python/modules python -m pytest -q \
            python/tests/test_trusted_runtime_continuity_coordinator.py \
            python/tests/test_trusted_runtime_capabilities_constraints_track_center.py \
            python/tests/test_trusted_runtime_roles_permissions_track_center.py
      - name: Gate decisions
        run: |
          PYTHONPATH=.:python:python/modules python -m pytest -q \
            python/tests/test_trusted_runtime_authorization_decision_gate.py
      - name: Evidence adapters
        run: |
          PYTHONPATH=.:python:python/modules python -m pytest -q \
            python/tests/test_trusted_runtime_authorization_evidence_adapters.py \
            python/tests/test_authorization_adapter_current_claims.py
      - name: Scope hardening
        run: |
          PYTHONPATH=.:python:python/modules python -m pytest -q \
            python/tests/test_authorization_negative_scope.py
      - name: Demo
        run: |
          PYTHONPATH=.:python:python/modules \
            python scripts/run_authorization_decision_gate_demo.py
