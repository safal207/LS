name: Capabilities Track Center

on:
  push:
    branches: [main, "feat/capability-center"]
  pull_request:
    paths:
      - "python/modules/trusted_runtime/capability_contract.py"
      - "python/modules/trusted_runtime/capabilities_constraints_track_center.py"
      - "python/tests/test_trusted_runtime_capabilities_constraints_track_center.py"
      - "schemas/trusted_runtime/capability_constraint_result.schema.json"
      - "scripts/run_capabilities_constraints_track_demo.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install jsonschema pytest ruff
      - name: Ruff
        run: |
          ruff check python/modules/trusted_runtime/capability_contract.py \
            python/modules/trusted_runtime/capabilities_constraints_track_center.py \
            python/tests/test_trusted_runtime_capabilities_constraints_track_center.py \
            scripts/run_capabilities_constraints_track_demo.py
      - name: Tests
        run: |
          PYTHONPATH=.:python:python/modules python -m pytest \
            python/tests/test_trusted_runtime_continuity_coordinator.py \
            python/tests/test_trusted_runtime_capabilities_constraints_track_center.py
      - name: Demo
        run: |
          PYTHONPATH=.:python:python/modules \
            python scripts/run_capabilities_constraints_track_demo.py
