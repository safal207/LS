name: Web4 Runtime CI

on:
  push:
    branches:
      - "main"
    paths: &web4_runtime_paths
      - "python/modules/web4_runtime/**"
      - "python/modules/web4_mesh/**"
      - "python/modules/web4_graph/**"
      - "python/modules/web4_bio/**"
      - "python/modules/hexagon_core/**"
      - "python/tests/test_web4_runtime.py"
      - "python/tests/test_web4_transport.py"
      - "python/tests/test_web4_federation_policy.py"
      - "python/tests/test_global_flow.py"
      - "python/tests/test_async_rtt.py"
      - "python/tests/test_fuzzy_runtime.py"
      - "python/tests/test_web4_runtime_loadtest.py"
      - "python/tests/test_web4_mesh.py"
      - "python/tests/test_web4_graph.py"
      - "python/tests/test_web4_interoperability.py"
      - "python/tests/test_web4_bio.py"
      - "python/tests/test_temporal_index.py"
      - "python/tests/test_belief_system.py"
      - "python/tests/test_circuit_breaker.py"
      - "python/tests/test_mission_state.py"
      - "python/tests/test_rust_bridge.py"
      - "python/tests/test_api_parity.py"
      - "scripts/web4_demo.py"
      - "scripts/web4_mesh_demo.py"
      - "scripts/web4meshdemo.py"
      - "scripts/web4meshinspect.py"
      - "scripts/web4meshtopology.py"
      - "scripts/web4_runtime_load.py"
      - "rust_core/**"
      - ".github/workflows/web4_runtime_ci.yml"
  pull_request:
    branches:
      - "main"
    paths: *web4_runtime_paths

concurrency:
  group: web4-runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web4-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIMINALQA_URL: ${{ secrets.LIMINALQA_URL }}
      LIMINALQA_TOKEN: ${{ secrets.LIMINALQA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev pkg-config

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov ruff mypy requests PyYAML psutil websockets
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Lint (ruff)
        run: |
          ruff check python/modules/web4_runtime python/modules/web4_mesh python/modules/web4_graph python/modules/web4_bio python/modules/hexagon_core scripts/web4_demo.py scripts/web4_mesh_demo.py scripts/web4meshdemo.py scripts/web4meshinspect.py scripts/web4meshtopology.py python/tests/test_web4_runtime.py python/tests/test_web4_mesh.py python/tests/test_web4_graph.py python/tests/test_web4_bio.py

      - name: Type check (mypy)
        run: |
          MYPYPATH=python mypy --explicit-package-bases --follow-imports=skip --ignore-missing-imports \
            -p python.modules.web4_runtime \
            -p python.modules.web4_mesh \
            -p python.modules.web4_graph \
            -p python.modules.web4_bio \
            -p python.modules.hexagon_core

      - name: Run Python smoke tests
        uses: ./.github/actions/run-pytest-liminalqa
        with:
          liminalqa-plan: python-runtime
          pytest-invocation: >-
            PYTHONPATH=python python -m pytest
            python/tests/test_web4_runtime.py
            python/tests/test_web4_mesh.py
            python/tests/test_web4_graph.py
            python/tests/test_web4_interoperability.py
            python/tests/test_web4_bio.py
            --junitxml=artifacts/web4-runtime-smoke-junit.xml
            --cov=python/modules/web4_runtime
            --cov=python/modules/web4_mesh
            --cov=python/modules/web4_graph
            --cov=python/modules/web4_bio
            --cov-report=xml:artifacts/web4-runtime-smoke-coverage.xml

      - name: Run Web4 runtime contract and load-smoke tests
        uses: ./.github/actions/run-pytest-liminalqa
        with:
          liminalqa-plan: python-runtime
          pytest-invocation: >-
            PYTHONPATH=python:python/modules python -m pytest
            python/tests/test_web4_transport.py
            python/tests/test_web4_federation_policy.py
            python/tests/test_global_flow.py
            python/tests/test_async_rtt.py
            python/tests/test_fuzzy_runtime.py
            python/tests/test_web4_runtime_loadtest.py
            --junitxml=artifacts/web4-runtime-contract-junit.xml
            --cov=python/modules/web4_runtime
            --cov=python/modules/web4_mesh
            --cov=python/modules/hexagon_core
            --cov-report=xml:artifacts/web4-runtime-contract-coverage.xml

      - name: Run hexagon_core unit tests
        uses: ./.github/actions/run-pytest-liminalqa
        with:
          liminalqa-plan: python-runtime
          pytest-invocation: >-
            PYTHONPATH=python:python/modules python -m pytest
            python/tests/test_temporal_index.py
            python/tests/test_belief_system.py
            python/tests/test_circuit_breaker.py
            python/tests/test_mission_state.py
            --junitxml=artifacts/hexagon-core-junit.xml
            --cov=python/modules/hexagon_core
            --cov-report=xml:artifacts/hexagon-core-coverage.xml

      - name: Rust build
        working-directory: rust_core
        run: |
          cargo build --release --no-default-features --features python

      - name: Rust lint (clippy)
        working-directory: rust_core
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust Python Bridge
        uses: ./.github/actions/run-pytest-liminalqa
        with:
          liminalqa-plan: rust-bridge
          pytest-invocation: >-
            PYTHONPATH=python:python/modules python -m pytest
            python/tests/test_rust_bridge.py
            --junitxml=artifacts/rust-bridge-junit.xml
            --cov=python/rust_bridge.py
            --cov-report=xml:artifacts/rust-bridge-coverage.xml

      - name: Test API Parity (Rust vs Fallback)
        uses: ./.github/actions/run-pytest-liminalqa
        with:
          liminalqa-plan: rust-bridge
          pytest-invocation: >-
            PYTHONPATH=python:python/modules python -m pytest
            python/tests/test_api_parity.py
            --junitxml=artifacts/api-parity-junit.xml
            --cov=python/rust_bridge.py
            --cov=python/modules/web4_runtime
            --cov-report=xml:artifacts/api-parity-coverage.xml

      - name: Run Rust tests
        working-directory: rust_core
        env:
          PYO3_PYTHON: python3
        run: |
          cargo test --all --release --no-default-features --features python-embed

      - name: Summarize quality artifacts
        if: always()
        uses: ./.github/actions/summarize-quality-artifacts
        with:
          label: web4-runtime
      - name: Quality gate
        if: always()
        uses: ./.github/actions/quality-gate
        with:
          label: web4-runtime
          max-failures: "0"
          min-line-coverage: "25"
          require-junit: "true"
          require-coverage: "true"
          enforce: "true"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web4-runtime-artifacts
          path: artifacts/
