name: Track Center Router

on:
  push:
    branches:
      - "main"
      - "feat/track-center-router-v0.1"
  pull_request:
    paths:
      - "python/modules/trusted_runtime/track_center_router.py"
      - "python/tests/test_trusted_runtime_track_center_router.py"
      - "schemas/trusted_runtime/track_center_route_result.schema.json"
      - "scripts/run_track_center_router_demo.py"
      - "docs/TRACK_CENTER_ROUTER_V0_1.md"
      - ".github/workflows/track_center_router.yml"

concurrency:
  group: track-center-router-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest ruff

      - name: Ruff router changes
        run: |
          ruff check \
            python/modules/trusted_runtime/track_center_router.py \
            python/tests/test_trusted_runtime_track_center_router.py \
            scripts/run_track_center_router_demo.py

      - name: Run routed continuity tests
        run: |
          PYTHONPATH=.:python:python/modules \
            python -m pytest \
              python/tests/test_trusted_runtime_continuity_coordinator.py \
              python/tests/test_trusted_runtime_relationship_loss_track_center.py \
              python/tests/test_trusted_runtime_track_center_router.py

      - name: Generate deterministic router artifacts
        run: |
          PYTHONPATH=.:python:python/modules \
            python scripts/run_track_center_router_demo.py \
              --output build/track-center-router

      - name: Verify routing and authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("build/track-center-router/summary.json").read_text()
          )
          assert summary["result"] == "PASS"
          decisions = {
              item["envelope_id"]: item for item in summary["decisions"]
          }
          assert decisions["track-envelope:valid"]["decision"] == "ROUTED"
          assert decisions["track-envelope:valid"][
              "nested_continuity_decision"
          ] == "ACCEPT_BOUNDED_OBSERVATION"
          assert decisions["track-envelope:unknown"]["decision"] == (
              "HOLD_UNKNOWN_ROUTE"
          )
          assert decisions["track-envelope:invalid"]["decision"] == (
              "HOLD_MALFORMED_PAYLOAD"
          )
          for item in decisions.values():
              assert item["relational_self_mutation_allowed"] is False
              assert item["stable_identity_update_allowed"] is False
              assert item["execution_authorized"] is False
          PY

      - name: Upload router evidence bundle
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: track-center-router-evidence
          path: build/track-center-router
          if-no-files-found: error
