name: Verified Transition Loop v0.13

on:
  pull_request:
    branches:
      - main
    paths:
      - "prototypes/verified-transition-loop/**"
      - ".github/workflows/verified-transition-loop-v0.13.yml"
  push:
    branches:
      - main
      - "agent/verified-transition-loop-v0.13"
    paths:
      - "prototypes/verified-transition-loop/**"
      - ".github/workflows/verified-transition-loop-v0.13.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate machine-readable contracts
        working-directory: prototypes/verified-transition-loop
        run: |
          python -m json.tool schemas/use-time-conformance-v0.4.schema.json > /dev/null
          python -m json.tool fixtures/use-time-conformance-v0.4.json > /dev/null
          python -m json.tool schemas/tool-dispatch-receipt-v0.7.schema.json > /dev/null
          python -m json.tool fixtures/tool-dispatch-receipt-v0.7.json > /dev/null
          python -m json.tool schemas/attested-dispatch-v0.8.schema.json > /dev/null
          python -m json.tool fixtures/attested-dispatch-v0.8.json > /dev/null
          python -m json.tool schemas/trust-root-snapshot-v0.9.schema.json > /dev/null
          python -m json.tool fixtures/trust-root-snapshot-v0.9.json > /dev/null
          python -m json.tool schemas/canonical-proof-v0.10.schema.json > /dev/null
          python -m json.tool fixtures/canonical-proof-v0.10.json > /dev/null
          python -m json.tool schemas/canonical-signed-envelope-v0.11.schema.json > /dev/null
          python -m json.tool fixtures/canonical-signed-envelope-v0.11.json > /dev/null
          python -m json.tool schemas/canonical-trust-root-snapshot-v0.12.schema.json > /dev/null
          python -m json.tool fixtures/canonical-trust-root-snapshot-v0.12.json > /dev/null
          python -m json.tool schemas/witnessed-freshness-v0.13.schema.json > /dev/null
          python -m json.tool fixtures/witnessed-freshness-v0.13.json > /dev/null

      - name: Install isolated VTL prototype
        working-directory: prototypes/verified-transition-loop
        run: python -m pip install -e '.[dev]'

      - name: Verify installed prototype version
        working-directory: prototypes/verified-transition-loop
        run: |
          python - <<'PY'
          from importlib.metadata import version
          assert version('verified-transition-loop') == '0.13.0'
          PY
      - name: Run focused VTL suite
        working-directory: prototypes/verified-transition-loop
        run: python -m pytest -q

      - name: Run Python canonical proof v0.10
        working-directory: prototypes/verified-transition-loop
        run: vtl-canonical-verify fixtures/canonical-proof-v0.10.json > /tmp/vtl-canonical-python.json

      - name: Run Node canonical proof v0.10
        working-directory: prototypes/verified-transition-loop
        run: node reference/canonical-v0.10.mjs fixtures/canonical-proof-v0.10.json > /tmp/vtl-canonical-node.json

      - name: Prove v0.10 Python and Node parity
        working-directory: prototypes/verified-transition-loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          python_result = json.loads(Path('/tmp/vtl-canonical-python.json').read_text())
          node_result = json.loads(Path('/tmp/vtl-canonical-node.json').read_text())
          assert python_result == node_result
          assert python_result['summary'] == {'total': 21, 'passed': 21, 'failed': 0, 'all_passed': True}
          PY

      - name: Preserve v0.10 malformed-fixture parity
        working-directory: prototypes/verified-transition-loop
        run: |
          python - <<'PY'
          import copy
          import json
          import shutil
          from pathlib import Path

          source = json.loads(Path('fixtures/canonical-proof-v0.10.json').read_text())
          output_dir = Path('/tmp/vtl-canonical-invalid')
          if output_dir.exists():
              shutil.rmtree(output_dir)
          output_dir.mkdir()
          fixtures = {}

          candidate = copy.deepcopy(source)
          candidate['cases'] = []
          fixtures['empty-cases'] = candidate

          candidate = copy.deepcopy(source)
          candidate['claimed_profile'] = 'different'
          fixtures['extra-root-field'] = candidate

          candidate = copy.deepcopy(source)
          candidate['negative_cases'][0]['id'] = candidate['cases'][0]['id']
          fixtures['duplicate-case-id'] = candidate

          candidate = copy.deepcopy(source)
          candidate['mutation_cases'][0]['digests_differ'] = False
          fixtures['mutation-may-match'] = candidate

          for name, fixture in fixtures.items():
              (output_dir / f'{name}.json').write_text(
                  json.dumps(fixture),
                  encoding='utf-8',
              )
          PY
          fixtures=(/tmp/vtl-canonical-invalid/*.json)
          if [[ ${#fixtures[@]} -ne 4 ]]; then
            echo "Expected four malformed v0.10 fixtures, found ${#fixtures[@]}" >&2
            exit 1
          fi
          for fixture in "${fixtures[@]}"; do
            if vtl-canonical-verify "$fixture" > /dev/null 2>&1; then
              echo "Python accepted invalid v0.10 fixture: $fixture" >&2
              exit 1
            fi
            if node reference/canonical-v0.10.mjs "$fixture" > /dev/null 2>&1; then
              echo "Node accepted invalid v0.10 fixture: $fixture" >&2
              exit 1
            fi
          done

      - name: Run Python canonical signed envelope v0.11
        working-directory: prototypes/verified-transition-loop
        run: vtl-canonical-envelope-verify fixtures/canonical-signed-envelope-v0.11.json > /tmp/vtl-envelope-python.json

      - name: Run Node canonical signed envelope v0.11
        working-directory: prototypes/verified-transition-loop
        run: node reference/canonical-signed-envelope-v0.11.mjs fixtures/canonical-signed-envelope-v0.11.json > /tmp/vtl-envelope-node.json

      - name: Prove v0.11 signature parity
        working-directory: prototypes/verified-transition-loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          py = json.loads(Path('/tmp/vtl-envelope-python.json').read_text())
          js = json.loads(Path('/tmp/vtl-envelope-node.json').read_text())
          assert py == js
          assert py['summary'] == {'total': 12, 'passed': 12, 'failed': 0, 'all_passed': True}
          PY

      - name: Preserve v0.11 malformed-fixture parity
        working-directory: prototypes/verified-transition-loop
        run: |
          python - <<'PY'
          import copy
          import json
          import shutil
          from pathlib import Path

          source = json.loads(
              Path('fixtures/canonical-signed-envelope-v0.11.json').read_text()
          )
          output_dir = Path('/tmp/vtl-envelope-invalid')
          if output_dir.exists():
              shutil.rmtree(output_dir)
          output_dir.mkdir()
          fixtures = {}

          candidate = copy.deepcopy(source)
          candidate['claimed_valid'] = True
          fixtures['extra-root-field'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'] = []
          fixtures['empty-cases'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][1]['id'] = candidate['cases'][0]['id']
          fixtures['duplicate-case-id'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['envelope_mutations'] = [
              {'path': '__proto__.polluted', 'value': True}
          ]
          fixtures['dangerous-path'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['envelope_mutations'] = [
              {'path': 'payload.missing', 'value': True}
          ]
          fixtures['missing-path'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['envelope_mutations'] = [
              {'path': 'payload.attempt', 'value': 1}
          ]
          fixtures['no-op-mutation'] = candidate

          for name, fixture in fixtures.items():
              (output_dir / f'{name}.json').write_text(
                  json.dumps(fixture),
                  encoding='utf-8',
              )
          PY
          fixtures=(/tmp/vtl-envelope-invalid/*.json)
          if [[ ${#fixtures[@]} -ne 6 ]]; then
            echo "Expected six malformed v0.11 fixtures, found ${#fixtures[@]}" >&2
            exit 1
          fi
          for fixture in "${fixtures[@]}"; do
            if vtl-canonical-envelope-verify "$fixture" > /dev/null 2>&1; then
              echo "Python accepted invalid v0.11 fixture: $fixture" >&2
              exit 1
            fi
            if node reference/canonical-signed-envelope-v0.11.mjs "$fixture" > /dev/null 2>&1; then
              echo "Node accepted invalid v0.11 fixture: $fixture" >&2
              exit 1
            fi
          done

      - name: Run Python canonical trust snapshot v0.12
        working-directory: prototypes/verified-transition-loop
        run: vtl-canonical-trust-root-verify fixtures/canonical-trust-root-snapshot-v0.12.json > /tmp/vtl-trust-python.json

      - name: Run Node canonical trust snapshot v0.12
        working-directory: prototypes/verified-transition-loop
        run: node reference/canonical-trust-root-snapshot-v0.12.mjs fixtures/canonical-trust-root-snapshot-v0.12.json > /tmp/vtl-trust-node.json

      - name: Prove fresh trust and rollback semantics match in Python and Node
        working-directory: prototypes/verified-transition-loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          py = json.loads(Path('/tmp/vtl-trust-python.json').read_text())
          js = json.loads(Path('/tmp/vtl-trust-node.json').read_text())
          assert py == js
          assert py['summary'] == {'total': 20, 'passed': 20, 'failed': 0, 'all_passed': True}
          assert py['parity']['signed_payload_matches_expected'] is True
          assert py['parity']['signature_matches_expected'] is True
          assert py['parity']['snapshot_digest_matches_expected'] is True
          by_id = {case['id']: case for case in py['cases']}
          assert by_id['valid-fresh']['actual']['valid'] is True
          assert by_id['rollback-old-signed-generation']['actual']['bootstrap_signature_valid'] is True
          assert by_id['rollback-old-signed-generation']['actual']['continuity_valid'] is False
          assert by_id['same-generation-fork']['actual']['bootstrap_signature_valid'] is True
          assert by_id['same-generation-fork']['actual']['continuity_valid'] is False
          assert by_id['trust-root-payload-tamper']['actual']['bootstrap_signature_valid'] is True
          assert by_id['trust-root-payload-tamper']['actual']['snapshot_integrity_valid'] is False
          PY

      - name: Prove v0.12 fixture contract fails closed across runtimes
        working-directory: prototypes/verified-transition-loop
        run: |
          python - <<'PY'
          import copy
          import json
          import shutil
          from pathlib import Path

          source = json.loads(
              Path('fixtures/canonical-trust-root-snapshot-v0.12.json').read_text()
          )
          output_dir = Path('/tmp/vtl-trust-invalid')
          if output_dir.exists():
              shutil.rmtree(output_dir)
          output_dir.mkdir()
          fixtures = {}

          candidate = copy.deepcopy(source)
          candidate['claimed_valid'] = True
          fixtures['extra-root-field'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'] = []
          fixtures['empty-cases'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][1]['id'] = candidate['cases'][0]['id']
          fixtures['duplicate-case-id'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['snapshot_mutations'] = [
              {'path': '__proto__.polluted', 'value': True}
          ]
          fixtures['dangerous-path'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['snapshot_mutations'] = [
              {'path': 'trust_root.missing', 'value': True}
          ]
          fixtures['missing-path'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['snapshot_mutations'] = [
              {'path': 'generation', 'value': source['base_snapshot']['generation']}
          ]
          fixtures['no-op-mutation'] = candidate

          for name, fixture in fixtures.items():
              (output_dir / f'{name}.json').write_text(
                  json.dumps(fixture),
                  encoding='utf-8',
              )
          PY
          fixtures=(/tmp/vtl-trust-invalid/*.json)
          if [[ ${#fixtures[@]} -ne 6 ]]; then
            echo "Expected six malformed v0.12 fixtures, found ${#fixtures[@]}" >&2
            exit 1
          fi
          for fixture in "${fixtures[@]}"; do
            if vtl-canonical-trust-root-verify "$fixture" > /dev/null 2>&1; then
              echo "Python accepted invalid v0.12 fixture: $fixture" >&2
              exit 1
            fi
            if node reference/canonical-trust-root-snapshot-v0.12.mjs "$fixture" > /dev/null 2>&1; then
              echo "Node accepted invalid v0.12 fixture: $fixture" >&2
              exit 1
            fi
          done

      - name: Run Python witnessed freshness v0.13
        working-directory: prototypes/verified-transition-loop
        run: vtl-witness-verify fixtures/witnessed-freshness-v0.13.json > /tmp/vtl-witness-python.json

      - name: Run Node witnessed freshness v0.13
        working-directory: prototypes/verified-transition-loop
        run: node reference/witnessed-freshness-v0.13.mjs fixtures/witnessed-freshness-v0.13.json > /tmp/vtl-witness-node.json

      - name: Prove witness quorum and equivocation semantics match in Python and Node
        working-directory: prototypes/verified-transition-loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          py = json.loads(Path('/tmp/vtl-witness-python.json').read_text())
          js = json.loads(Path('/tmp/vtl-witness-node.json').read_text())
          trust = json.loads(
              Path('fixtures/canonical-trust-root-snapshot-v0.12.json').read_text()
          )
          witness = json.loads(Path('fixtures/witnessed-freshness-v0.13.json').read_text())
          assert py == js
          assert py['summary'] == {'total': 20, 'passed': 20, 'failed': 0, 'all_passed': True}
          assert witness['snapshot_view']['snapshot_digest'] == trust['expected_fresh_snapshot_digest']
          by_id = {case['id']: case for case in py['cases']}
          split = by_id['split-view-blocks-even-with-target-quorum']['actual']
          assert split['witness_quorum_valid'] is True
          assert split['equivocation_detected'] is True
          assert split['view_consistency_valid'] is False
          assert split['valid'] is False
          lower = by_id['local-v012-failure-not-rescued']['actual']
          assert lower['witness_quorum_valid'] is True
          assert lower['local_snapshot_valid'] is False
          assert lower['valid'] is False
          duplicate = by_id['duplicate-witness-does-not-count-twice']['actual']
          assert duplicate['accepted_witness_ids'] == ['witness-a']
          assert duplicate['witness_quorum_valid'] is False
          PY

      - name: Prove v0.13 fixture contract fails closed across runtimes
        working-directory: prototypes/verified-transition-loop
        run: |
          python - <<'PY'
          import copy
          import json
          import shutil
          from pathlib import Path

          source = json.loads(
              Path('fixtures/witnessed-freshness-v0.13.json').read_text()
          )
          output_dir = Path('/tmp/vtl-witness-invalid')
          if output_dir.exists():
              shutil.rmtree(output_dir)
          output_dir.mkdir()
          fixtures = {}

          candidate = copy.deepcopy(source)
          candidate['claimed_valid'] = True
          fixtures['extra-root-field'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'] = []
          fixtures['empty-cases'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][1]['id'] = candidate['cases'][0]['id']
          fixtures['duplicate-case-id'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['authority_mutations'] = [
              {'path': '__proto__.polluted', 'value': True}
          ]
          fixtures['dangerous-path'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['statement_mutations'] = [
              {'index': 0, 'path': 'missing', 'value': True}
          ]
          fixtures['missing-path'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['authority_mutations'] = [
              {'path': 'quorum', 'value': source['witness_authority']['quorum']}
          ]
          fixtures['no-op-mutation'] = candidate

          candidate = copy.deepcopy(source)
          candidate['witness_authority']['keys'][0]['public_key_base64'] = 'AAAA'
          fixtures['bad-baseline-key-material'] = candidate

          candidate = copy.deepcopy(source)
          candidate['statements']['a_target']['profile_id'] = 'vtl-witness-statement/v999'
          fixtures['bad-baseline-statement-profile'] = candidate

          candidate = copy.deepcopy(source)
          del candidate['cases'][0]['expected']['witness_signature_valid']
          fixtures['partial-expected-result'] = candidate

          candidate = copy.deepcopy(source)
          candidate['cases'][0]['statement_mutations'] = [
              {'index': 99, 'path': 'signature', 'value': 'AQ=='}
          ]
          fixtures['statement-index-out-of-range'] = candidate

          for name, fixture in fixtures.items():
              (output_dir / f'{name}.json').write_text(
                  json.dumps(fixture),
                  encoding='utf-8',
              )
          PY
          fixtures=(/tmp/vtl-witness-invalid/*.json)
          if [[ ${#fixtures[@]} -ne 10 ]]; then
            echo "Expected ten malformed v0.13 fixtures, found ${#fixtures[@]}" >&2
            exit 1
          fi
          for fixture in "${fixtures[@]}"; do
            if vtl-witness-verify "$fixture" > /dev/null 2>&1; then
              echo "Python accepted invalid v0.13 fixture: $fixture" >&2
              exit 1
            fi
            if node reference/witnessed-freshness-v0.13.mjs "$fixture" > /dev/null 2>&1; then
              echo "Node accepted invalid v0.13 fixture: $fixture" >&2
              exit 1
            fi
          done

      - name: Run vendor-neutral use-time conformance
        working-directory: prototypes/verified-transition-loop
        run: vtl-conformance fixtures/use-time-conformance-v0.4.json

      - name: Run detached dispatch receipt conformance
        working-directory: prototypes/verified-transition-loop
        run: vtl-dispatch-verify fixtures/tool-dispatch-receipt-v0.7.json

      - name: Run attested dispatch authenticity conformance
        working-directory: prototypes/verified-transition-loop
        run: vtl-attestation-verify fixtures/attested-dispatch-v0.8.json

      - name: Run rollback-resistant trust-root conformance v0.9
        working-directory: prototypes/verified-transition-loop
        run: vtl-trust-root-verify fixtures/trust-root-snapshot-v0.9.json

      - name: Verify side-effect-free deployment demo
        working-directory: prototypes/verified-transition-loop
        run: |
          python -m verified_transition_loop.deployment_demo > /tmp/vtl-demo.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/vtl-demo.json').read_text())
          assert data['external_side_effects_performed'] is False
          assert data['healthy']['deploy'] == 'COMMIT'
          assert data['health_failure']['deploy'] == 'ROLLBACK'
          assert data['health_failure']['rollback'] == 'COMMIT'
          assert data['pre_execute_drift']['use_time'] == 'BLOCK'
          assert data['pre_execute_drift']['execution_performed'] is False
          PY
