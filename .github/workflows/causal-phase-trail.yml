name: Causal phase trail conformance

on:
  pull_request:
    paths:
      - "ls-conformance/causal_phase_trail/**"
      - ".github/workflows/causal-phase-trail.yml"
  workflow_dispatch:

permissions: {}

jobs:
  causal-phase-trail:
    name: CPT-001 deterministic trail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate real PR 164 specimen
        run: |
          python ls-conformance/causal_phase_trail/validate.py \
            ls-conformance/causal_phase_trail/fixtures/robys_pr_164_wordmark.json

      - name: Validate individual system environment overlay
        run: |
          python ls-conformance/causal_phase_trail/validate_levels.py \
            ls-conformance/causal_phase_trail/fixtures/robys_pr_164_wordmark.json \
            ls-conformance/causal_phase_trail/fixtures/robys_pr_164_levels.json

      - name: Validate July 2026 visual benchmark axis
        run: |
          python ls-conformance/causal_phase_trail/validate_visual_benchmark.py \
            ls-conformance/causal_phase_trail/fixtures/robys_pr_164_wordmark.json \
            ls-conformance/causal_phase_trail/fixtures/robys_pr_164_visual_benchmark_2026_07.json

      - name: Run mutation suite
        run: |
          python -m unittest discover \
            -s ls-conformance/causal_phase_trail/tests -v

      - name: Publish phase summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("ls-conformance/causal_phase_trail/fixtures")
          trail = json.loads((root / "robys_pr_164_wordmark.json").read_text(encoding="utf-8"))
          levels = json.loads((root / "robys_pr_164_levels.json").read_text(encoding="utf-8"))
          benchmark = json.loads((root / "robys_pr_164_visual_benchmark_2026_07.json").read_text(encoding="utf-8"))
          loop = " -> ".join(levels["summary"]["dominantLoop"])
          largest_gap = ", ".join(benchmark["summary"]["largestGapCriterionIds"])
          lines = [
              "# Causal Phase Trail 001",
              "",
              f"**Trail:** {trail['trailId']}  ",
              f"**Subject:** {trail['subject']['repository']}#{trail['subject']['pullRequest']}  ",
              f"**Exact head:** `{trail['subject']['currentHead']}`  ",
              f"**Current phase:** {trail['decision']['currentPhase']}  ",
              f"**Best route:** {trail['decision']['bestRouteId']}  ",
              f"**Unresolved blockers:** {len(trail['decision']['unresolvedBlockerNodeIds'])}  ",
              f"**Level loop:** {loop}  ",
              f"**Visual benchmark period:** {benchmark['benchmarkWindow']['periodKey']}  ",
              f"**Visual score:** {benchmark['summary']['weightedCurrentScore']} / {benchmark['summary']['weightedTargetScore']}  ",
              f"**Largest visual gap:** {largest_gap}  ",
              f"**Benchmark refresh after:** {benchmark['summary']['refreshRequiredAfter']}",
              "",
              "> Trail and visual benchmark record evidence and explanation. Neither grants merge or execution authority.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
