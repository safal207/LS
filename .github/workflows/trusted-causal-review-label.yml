# SECURITY BOUNDARY:
# - Loaded from protected main through pull_request_target.
# - Triggered only by the maintainer-controlled `causal-review` label.
# - Never checks out, installs, builds, sources, or executes target-PR code.
# - The target patch is read only as untrusted data through the verified GitHub API path.
name: Trusted Causal Review — Label Command

on:
  pull_request_target:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: trusted-causal-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ensemble:
    name: Verify and run labeled causal review
    if: >-
      ${{
        github.event.label.name == 'causal-review'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(
          fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.pull_request.author_association
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 42

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      REQUEST_DIR: /tmp/causal-review-request
      OUTPUT_DIR: /tmp/causal-review-ensemble
      TARGET_ENV_FILE: /tmp/causal-review-ensemble/target.env
      CAUSAL_PROMPT_FILE: .github/prompts/causal-review-v0.1.md
      PATCH_LIMIT_CHARS: "60000"
      XAI_MODEL: grok-4.5
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-reasoner' }}
      DEEPSEEK_API_URL: ${{ vars.DEEPSEEK_API_URL || 'https://api.deepseek.com/chat/completions' }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.6-terra' }}
      CODEX_MAX_OUTPUT_TOKENS: ${{ vars.CODEX_MAX_OUTPUT_TOKENS || '12000' }}
      OPENAI_RESPONSES_API_URL: ${{ vars.OPENAI_RESPONSES_API_URL || 'https://api.openai.com/v1/responses' }}

    steps:
      - name: Check out protected main implementation
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Collect exact patch and observer evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REQUEST_DIR" "$OUTPUT_DIR"
          python tools/retrying_causal_review_github.py collect \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --output-dir "$REQUEST_DIR"

      - name: Verify exact target before credentials
        id: request
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/retrying_causal_review_github.py verify \
            --input-dir "$REQUEST_DIR" \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$GITHUB_RUN_ID" \
            --expected-pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-head-branch "$EXPECTED_HEAD_BRANCH" \
            --output "$OUTPUT_DIR/trusted-request.json" \
            --env-file "$TARGET_ENV_FILE" \
            2>&1 | tee "$OUTPUT_DIR/request-verification.txt"

      - name: Adapt collected observer lanes
        if: ${{ steps.request.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/causal_review_adapters.py adapt \
            "$REQUEST_DIR/coderabbit-bundle.json" \
            --output "$OUTPUT_DIR/coderabbit-review.json"
          python tools/causal_review_adapters.py adapt \
            "$REQUEST_DIR/qodo-bundle.json" \
            --output "$OUTPUT_DIR/qodo-review.json"

      - name: Run native causal reviewers
        if: ${{ steps.request.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 32
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: bash tools/run_native_causal_reviewers.sh

      - name: Reverify exact head after model calls
        id: final_request
        if: ${{ always() && steps.request.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/retrying_causal_review_github.py verify \
            --input-dir "$REQUEST_DIR" \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$GITHUB_RUN_ID" \
            --expected-pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-head-branch "$EXPECTED_HEAD_BRANCH" \
            --output "$OUTPUT_DIR/final-trusted-request.json" \
            --env-file "$OUTPUT_DIR/final-target.env" \
            2>&1 | tee "$OUTPUT_DIR/final-verification.txt"

      - name: Build exact-target ensemble report
        if: ${{ steps.request.outcome == 'success' && steps.final_request.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/causal_review_pilot.py \
            --raw \
              "$REQUEST_DIR/coderabbit-bundle.json" \
              "$REQUEST_DIR/qodo-bundle.json" \
              "$OUTPUT_DIR/grok-review.json" \
              "$OUTPUT_DIR/deepseek-lane.json" \
              "$OUTPUT_DIR/codex-review.json" \
            --reviews \
              "$OUTPUT_DIR/coderabbit-review.json" \
              "$OUTPUT_DIR/qodo-review.json" \
              "$OUTPUT_DIR/grok-review.json" \
              "$OUTPUT_DIR/deepseek-review.json" \
              "$OUTPUT_DIR/codex-review.json" \
            --measurement-class ENSEMBLE \
            --output "$OUTPUT_DIR/ensemble-report.json"

      - name: Upload exact ensemble evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trusted-causal-label-pr-${{ env.PR_NUMBER }}-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            ${{ env.REQUEST_DIR }}
            ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish trusted ensemble comment
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- trusted-causal-review-ensemble -->';
            const requestPath = `${process.env.OUTPUT_DIR}/trusted-request.json`;
            const reportPath = `${process.env.OUTPUT_DIR}/ensemble-report.json`;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issue_number = Number(process.env.PR_NUMBER);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            let body;
            if (!fs.existsSync(requestPath)) {
              body = `${marker}\n## 🧭 Trusted causal ensemble — REJECTED\n\nThe exact target could not be verified before credentials. No model result is valid.\n\n- Workflow run: ${runUrl}`;
            } else {
              const request = JSON.parse(fs.readFileSync(requestPath, 'utf8'));
              const target = request.target;
              if (!fs.existsSync(reportPath)) {
                body = `${marker}\n## 🧭 Trusted causal ensemble — STALE/FAILED\n\nInitial verification passed, but final exact-head verification or report construction failed. No model finding is valid for publication.\n\n- Exact head: \`${target.head_sha}\`\n- Patch: \`${target.patch_sha256}\`\n- Workflow run: ${runUrl}`;
              } else {
                const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                const rate = value => value === null ? 'n/a' : `${(value * 100).toFixed(1)}%`;
                const incomplete = report.incomplete_lanes.length
                  ? report.incomplete_lanes.map(lane => `- \`${lane.provider}\`: ${lane.status} / ${lane.provenance}`).join('\n')
                  : '_None_';
                body = `${marker}\n## 🧭 Trusted causal ensemble — PROVISIONAL\n\n- Exact head: \`${target.head_sha}\`\n- Patch: \`${target.patch_sha256}\`\n- Raw findings: **${report.raw_finding_count}**\n- Evidence-bound findings: **${report.evidence_bound_count}**\n- Root-cause clusters: **${report.root_cause_cluster_count}**\n- Corroborated clusters: **${report.corroborated_cluster_count}**\n- Human adjudication items: **${report.adjudication_item_count}**\n- Provisional queue reduction: **${rate(report.human_queue_reduction)}**\n\n### Incomplete lanes\n${incomplete}\n\n⚠️ Advisory only. Human adjudication is pending; this ensemble cannot approve, block, or merge.\n\n- Workflow run: ${runUrl}`;
              }
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Remove command label
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'causal-review',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
