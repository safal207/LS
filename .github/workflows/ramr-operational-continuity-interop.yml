name: RAMR operational continuity interop

on:
  pull_request:
    paths:
      - "spec/ramr-operational-continuity-interop-v0.1.md"
      - "fixtures/operational-continuity/**"
      - "tools/run_operational_continuity_fixtures.py"
      - "tools/export_ramr_operational_continuity_interop.py"
      - "tools/run_ramr_ls_shared_evidence_fixture.py"
      - "tools/run_ramr_ls_fixture_suite.py"
      - ".github/workflows/ramr-operational-continuity-interop.yml"
  push:
    branches:
      - main
    paths:
      - "spec/ramr-operational-continuity-interop-v0.1.md"
      - "fixtures/operational-continuity/**"
      - "tools/run_operational_continuity_fixtures.py"
      - "tools/export_ramr_operational_continuity_interop.py"
      - "tools/run_ramr_ls_shared_evidence_fixture.py"
      - "tools/run_ramr_ls_fixture_suite.py"

permissions:
  contents: read

jobs:
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen shared inputs
        run: |
          python -m json.tool fixtures/operational-continuity/shared-envelope/schema-v0.1.json > /dev/null
          for fixture in \
            duplicate_successful_outcome \
            superseded_approval \
            incomplete_dependency_chain \
            target_state_drift; do
            python -m json.tool "fixtures/operational-continuity/shared-envelope/${fixture}.json" > /dev/null
            test -s "fixtures/operational-continuity/shared-envelope/${fixture}.sha256"
          done
      - name: Run frozen shared fixture
        run: python tools/run_ramr_ls_shared_evidence_fixture.py
      - name: Run RAMR v0.3.0 fixture suite
        run: python tools/run_ramr_ls_fixture_suite.py
      - name: Validate frozen shared results
        run: |
          python -m json.tool artifacts/ramr-ls-duplicate-successful-outcome-result.json > /dev/null
          python -m json.tool artifacts/ramr-ls-fixture-suite-result.json > /dev/null
      - name: Export interoperability result
        run: python tools/export_ramr_operational_continuity_interop.py
      - name: Validate interoperability output
        run: python -m json.tool artifacts/ramr-operational-continuity-interop-result.json > /dev/null
