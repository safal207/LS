name: Qwen Autopilot Agent

on:
  pull_request:
    paths:
      - "hackathons/qwen-autopilot-agent/**"
      - ".github/workflows/qwen-autopilot-agent.yml"
  push:
    branches: [main]
    paths:
      - "hackathons/qwen-autopilot-agent/**"
      - ".github/workflows/qwen-autopilot-agent.yml"

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hackathons/qwen-autopilot-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hackathons/qwen-autopilot-agent/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m py_compile app/*.py
