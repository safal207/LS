name: VerifiedEpisode v0.2 Identity Aggregation

on:
  push:
    branches:
      - "feat/identity-learning-v0-2"
  pull_request:
    paths:
      - "python/modules/trusted_runtime/identity_learning_v02.py"
      - "python/tests/test_trusted_runtime_identity_learning_v02.py"
      - "schemas/trusted_runtime/lesson_aggregation_v0.2.schema.json"
      - "scripts/aggregate_verified_episodes_v02.py"
      - ".github/workflows/identity_learning_v02.yml"

concurrency:
  group: identity-learning-v02-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest ruff==0.15.5

      - name: Ruff v0.2 aggregation path
        run: |
          ruff check \
            python/modules/trusted_runtime/identity_learning_v02.py \
            python/tests/test_trusted_runtime_identity_learning_v02.py \
            scripts/aggregate_verified_episodes_v02.py

      - name: Compile v0.2 aggregation path
        run: |
          python -m py_compile \
            python/modules/trusted_runtime/identity_learning_v02.py \
            scripts/aggregate_verified_episodes_v02.py

      - name: Run v0.2 aggregation tests
        run: |
          PYTHONPATH=.:python:python/modules \
            python -m pytest \
              python/tests/test_trusted_runtime_identity_learning_v02.py

      - name: Verify CLI surface
        run: |
          PYTHONPATH=.:python:python/modules \
            python scripts/aggregate_verified_episodes_v02.py --help
