name: Projects Track Center

on:
  push:
    branches:
      - "main"
      - "feat/projects-track-center-v0.1"
  pull_request:
    paths:
      - "python/modules/trusted_runtime/continuity_coordinator.py"
      - "python/modules/trusted_runtime/projects_track_center.py"
      - "python/tests/test_trusted_runtime_continuity_coordinator.py"
      - "python/tests/test_trusted_runtime_projects_track_center.py"
      - "schemas/trusted_runtime/continuity_assessment.schema.json"
      - "schemas/trusted_runtime/project_track_result.schema.json"
      - "scripts/run_projects_track_demo.py"
      - "docs/PROJECTS_TRACK_CENTER_V0_1.md"
      - ".github/workflows/projects_track_center.yml"

concurrency:
  group: projects-track-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest ruff

      - name: Ruff project changes
        run: |
          ruff check \
            python/modules/trusted_runtime/continuity_coordinator.py \
            python/modules/trusted_runtime/projects_track_center.py \
            python/tests/test_trusted_runtime_continuity_coordinator.py \
            python/tests/test_trusted_runtime_projects_track_center.py \
            scripts/run_projects_track_demo.py

      - name: Run project continuity tests
        run: |
          PYTHONPATH=.:python:python/modules \
            python -m pytest \
              python/tests/test_trusted_runtime_continuity_coordinator.py \
              python/tests/test_trusted_runtime_projects_track_center.py

      - name: Generate deterministic project artifacts
        run: |
          PYTHONPATH=.:python:python/modules \
            python scripts/run_projects_track_demo.py \
              --output build/projects-track-center

      - name: Verify phantom-task and authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("build/projects-track-center/summary.json").read_text()
          )
          assert summary["result"] == "PASS"
          decisions = {item["event_id"]: item for item in summary["decisions"]}
          assert decisions["project-event:lesson"]["decision"] == (
              "ACCEPT_BOUNDED_OBSERVATION"
          )
          assert decisions["project-event:lesson"][
              "lesson_candidate_emitted"
          ] is True
          assert decisions["project-event:paused-task"]["decision"] == (
              "HOLD_FOR_REVIEW"
          )
          assert decisions["project-event:closed-task"]["decision"] == (
              "BLOCK_FALSE_PRESENCE"
          )
          assert decisions["project-event:active-task"]["decision"] == (
              "ACCEPT_BOUNDED_OBSERVATION"
          )
          for item in decisions.values():
              assert item["project_registry_mutation_allowed"] is False
              assert item["task_scheduling_allowed"] is False
              assert item["stable_identity_update_allowed"] is False
              assert item["execution_authorized"] is False
          PY

      - name: Upload project evidence bundle
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: projects-track-center-evidence
          path: build/projects-track-center
          if-no-files-found: error
