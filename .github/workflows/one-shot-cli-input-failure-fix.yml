name: One-shot CLI input failure fix

on:
  push:
    branches:
      - agent/inter-agent-dispatch-audit-v0-1
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: one-shot-cli-input-failure-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'safal207/LS' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inter-agent-dispatch-audit-v0-1
          fetch-depth: 0
      - name: Apply bounded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          validator_path = Path("tools/validate_inter_agent_dispatch_audit_v0_1.py")
          validator = validator_path.read_text(encoding="utf-8")
          old = '''def main() -> int:
              """Run CLI validation and return a process-compatible status code."""
              parser = argparse.ArgumentParser()
              parser.add_argument("fixture", type=Path)
              parser.add_argument("schema", type=Path)
              args = parser.parse_args()

              result = validate_fixture(load_object(args.fixture), load_object(args.schema))
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["passed"] else 1
          '''.replace("          ", "")
          new = '''def input_failure_report(exc: Exception) -> dict[str, Any]:
              """Build deterministic structured output for CLI input failures."""
              return {
                  "fixture_id": None,
                  "contract_version": CONTRACT_VERSION,
                  "passed": False,
                  "fixture_errors": [
                      {
                          "code": "INPUT_LOAD_FAILED",
                          "location": "cli",
                          "message": str(exc),
                      }
                  ],
                  "canonical": {"passed": False, "errors": []},
                  "negative_vectors": [],
              }


          def main() -> int:
              """Run CLI validation and return a process-compatible status code."""
              parser = argparse.ArgumentParser()
              parser.add_argument("fixture", type=Path)
              parser.add_argument("schema", type=Path)
              args = parser.parse_args()

              try:
                  fixture = load_object(args.fixture)
                  schema = load_object(args.schema)
                  result = validate_fixture(fixture, schema)
              except (OSError, json.JSONDecodeError, ValueError) as exc:
                  result = input_failure_report(exc)

              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["passed"] else 1
          '''.replace("          ", "")
          if old not in validator:
              raise SystemExit("validator main block no longer matches the bounded patch")
          validator_path.write_text(validator.replace(old, new, 1), encoding="utf-8")

          workflow_path = Path(".github/workflows/operational-continuity-fixtures.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          if "Validate structured CLI input failures" not in workflow:
              workflow += '''
                - name: Validate structured CLI input failures
                  run: |
                    tmp_dir="$(mktemp -d)"
                    printf '{invalid-json' > "$tmp_dir/bad.json"
                    printf '[]' > "$tmp_dir/non-object.json"
                    check_failure() {
                      label="$1"
                      fixture="$2"
                      output="$tmp_dir/$label-output.json"
                      set +e
                      python tools/validate_inter_agent_dispatch_audit_v0_1.py \
                        "$fixture" \
                        fixtures/operational-continuity/inter-agent-dispatch-audit/schema-v0.1.json \
                        > "$output"
                      status=$?
                      set -e
                      test "$status" -eq 1
                      python - "$output" <<'CHECK'
                    import json
                    import sys

                    with open(sys.argv[1], encoding="utf-8") as handle:
                        report = json.load(handle)
                    assert report["passed"] is False
                    errors = report["fixture_errors"]
                    assert len(errors) == 1
                    assert errors[0]["code"] == "INPUT_LOAD_FAILED"
                    assert errors[0]["location"] == "cli"
                    assert errors[0]["message"]
                    CHECK
                    }
                    check_failure malformed "$tmp_dir/bad.json"
                    check_failure non_object "$tmp_dir/non-object.json"
                    check_failure missing "$tmp_dir/missing.json"
          '''.replace("          ", "")
              workflow_path.write_text(workflow, encoding="utf-8")

          Path(".github/workflows/one-shot-cli-input-failure-fix.yml").unlink()
          PY
      - name: Commit bounded fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/validate_inter_agent_dispatch_audit_v0_1.py \
            .github/workflows/operational-continuity-fixtures.yml \
            .github/workflows/one-shot-cli-input-failure-fix.yml
          git commit -m "structure CLI input failures"
          git push origin HEAD:agent/inter-agent-dispatch-audit-v0-1
