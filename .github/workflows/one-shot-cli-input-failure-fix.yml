name: One-shot CLI input failure fix

on:
  push:
    branches:
      - agent/inter-agent-dispatch-audit-v0-1
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: one-shot-cli-input-failure-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'safal207/LS' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inter-agent-dispatch-audit-v0-1
          fetch-depth: 0
      - name: Apply bounded validator patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/validate_inter_agent_dispatch_audit_v0_1.py")
          text = path.read_text(encoding="utf-8")
          if "def input_failure_report(" in text:
              raise SystemExit(0)

          old = '''def main() -> int:
              """Run CLI validation and return a process-compatible status code."""
              parser = argparse.ArgumentParser()
              parser.add_argument("fixture", type=Path)
              parser.add_argument("schema", type=Path)
              args = parser.parse_args()

              result = validate_fixture(load_object(args.fixture), load_object(args.schema))
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["passed"] else 1
          '''.replace("          ", "")
          new = '''def input_failure_report(exc: Exception) -> dict[str, Any]:
              """Build deterministic structured output for CLI input failures."""
              return {
                  "fixture_id": None,
                  "contract_version": CONTRACT_VERSION,
                  "passed": False,
                  "fixture_errors": [
                      {
                          "code": "INPUT_LOAD_FAILED",
                          "location": "cli",
                          "message": str(exc),
                      }
                  ],
                  "canonical": {"passed": False, "errors": []},
                  "negative_vectors": [],
              }


          def main() -> int:
              """Run CLI validation and return a process-compatible status code."""
              parser = argparse.ArgumentParser()
              parser.add_argument("fixture", type=Path)
              parser.add_argument("schema", type=Path)
              args = parser.parse_args()

              try:
                  fixture = load_object(args.fixture)
                  schema = load_object(args.schema)
                  result = validate_fixture(fixture, schema)
              except (OSError, json.JSONDecodeError, ValueError) as exc:
                  result = input_failure_report(exc)

              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["passed"] else 1
          '''.replace("          ", "")
          if old not in text:
              raise SystemExit("validator main block no longer matches bounded patch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit validator patch
        run: |
          if git diff --quiet -- tools/validate_inter_agent_dispatch_audit_v0_1.py; then
            echo "Validator already patched."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/validate_inter_agent_dispatch_audit_v0_1.py
          git commit -m "structure CLI input failures"
          git push origin HEAD:agent/inter-agent-dispatch-audit-v0-1
