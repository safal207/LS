name: Cognitive Trail Contract

on:
  push:
    branches:
      - "main"
    paths:
      - "schemas/cognitive_trail_run.schema.json"
      - "examples/trails/*.json"
      - "scripts/validate_cognitive_trail_runs.py"
      - "docs/COGNITIVE_TRAIL_RUN_CONTRACT.md"
      - "docs/COOPERATIVE_PRECISION_METRICS.md"
      - ".github/workflows/cognitive_trail_contract.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "schemas/cognitive_trail_run.schema.json"
      - "examples/trails/*.json"
      - "scripts/validate_cognitive_trail_runs.py"
      - "docs/COGNITIVE_TRAIL_RUN_CONTRACT.md"
      - "docs/COOPERATIVE_PRECISION_METRICS.md"
      - ".github/workflows/cognitive_trail_contract.yml"

concurrency:
  group: cognitive-trail-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cognitive-trail-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validator dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Validate Cognitive Trail Run examples
        run: |
          python scripts/validate_cognitive_trail_runs.py
