name: Cognitive Trail Contract

on:
  push:
    branches:
      - "main"
    paths:
      - "schemas/cognitive_trail_run.schema.json"
      - "schemas/route_stability_sample.schema.json"
      - "examples/trails/*.json"
      - "examples/route-stability/*.json"
      - "python/tests/fixtures/route-stability/*.json"
      - "scripts/validate_cognitive_trail_runs.py"
      - "scripts/generate_pr_review_trail_run.py"
      - "scripts/run_nash_route_stability_demo.py"
      - "python/tests/test_generate_pr_review_trail_run.py"
      - "python/tests/test_nash_route_stability.py"
      - "docs/COGNITIVE_TRAIL_RUN_CONTRACT.md"
      - "docs/COGNITIVE_TRAIL_REVIEWER_QUICKSTART.md"
      - "docs/COGNITIVE_TRAIL_EVIDENCE_SNAPSHOT.md"
      - "docs/COGNITIVE_TRAIL_PR_REVIEW_BENCHMARK_NOTE.md"
      - "docs/COGNITIVE_TRAIL_CONTRIBUTOR_TASKS.md"
      - "docs/COOPERATIVE_PRECISION_METRICS.md"
      - "docs/ROUTE_STABILITY_SAMPLE_CONTRACT.md"
      - ".github/workflows/cognitive_trail_contract.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "schemas/cognitive_trail_run.schema.json"
      - "schemas/route_stability_sample.schema.json"
      - "examples/trails/*.json"
      - "examples/route-stability/*.json"
      - "python/tests/fixtures/route-stability/*.json"
      - "scripts/validate_cognitive_trail_runs.py"
      - "scripts/generate_pr_review_trail_run.py"
      - "scripts/run_nash_route_stability_demo.py"
      - "python/tests/test_generate_pr_review_trail_run.py"
      - "python/tests/test_nash_route_stability.py"
      - "docs/COGNITIVE_TRAIL_RUN_CONTRACT.md"
      - "docs/COGNITIVE_TRAIL_REVIEWER_QUICKSTART.md"
      - "docs/COGNITIVE_TRAIL_EVIDENCE_SNAPSHOT.md"
      - "docs/COGNITIVE_TRAIL_PR_REVIEW_BENCHMARK_NOTE.md"
      - "docs/COGNITIVE_TRAIL_CONTRIBUTOR_TASKS.md"
      - "docs/COOPERATIVE_PRECISION_METRICS.md"
      - "docs/ROUTE_STABILITY_SAMPLE_CONTRACT.md"
      - ".github/workflows/cognitive_trail_contract.yml"

concurrency:
  group: cognitive-trail-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cognitive-trail-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest

      - name: Validate Cognitive Trail Run examples
        run: |
          python scripts/validate_cognitive_trail_runs.py

      - name: Test PR review trail-run generator
        run: |
          PYTHONPATH=.:python:python/modules python -m pytest python/tests/test_generate_pr_review_trail_run.py

      - name: Test Nash-style route stability probe
        run: |
          PYTHONPATH=.:python:python/modules python -m pytest python/tests/test_nash_route_stability.py

      - name: Generate Cognitive Trail report artifacts
        run: |
          mkdir -p reports/trails/ci
          python scripts/generate_pr_review_trail_run.py \
            --last 5 \
            --validate \
            --output reports/trails/ci/cognitive_trail_run.json \
            --markdown-output reports/trails/ci/cognitive_trail_run_report.md

      - name: Generate Nash-style route stability artifact
        run: |
          mkdir -p reports/trails/ci
          python scripts/run_nash_route_stability_demo.py --json > reports/trails/ci/nash_route_stability.json

      - name: Upload Cognitive Trail report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-trail-report-${{ github.sha }}
          path: |
            reports/trails/ci/cognitive_trail_run.json
            reports/trails/ci/cognitive_trail_run_report.md
            reports/trails/ci/nash_route_stability.json
          if-no-files-found: error
          retention-days: 14

      - name: Write Cognitive Trail workflow summary
        run: |
          {
            echo "## Cognitive Trail Contract"
            echo ""
            echo "Generated and validated a fresh LS Cognitive Trail runtime report and Nash-style route stability artifact."
            echo ""
            echo "### Validation checks"
            echo ""
            echo "- Validated checked-in Cognitive Trail examples against \`schemas/cognitive_trail_run.schema.json\`."
            echo "- Ran generator and negative validation tests for Cognitive Trail artifacts."
            echo "- Tested the Nash-style route stability sample against \`schemas/route_stability_sample.schema.json\`."
            echo "- Confirmed the route-stability negative fixture is rejected: \`python/tests/fixtures/route-stability/invalid_metric_version.json\`."
            echo "- Pinned the checked-in route-stability sample to deterministic \`scripts/run_nash_route_stability_demo.py --json\` output."
            echo ""
            echo "### Cognitive Trail command"
            echo '```bash'
            echo "python scripts/generate_pr_review_trail_run.py \\" 
            echo "  --last 5 \\" 
            echo "  --validate \\" 
            echo "  --output reports/trails/ci/cognitive_trail_run.json \\" 
            echo "  --markdown-output reports/trails/ci/cognitive_trail_run_report.md"
            echo '```'
            echo ""
            echo "### Nash-style route stability command"
            echo '```bash'
            echo "python scripts/run_nash_route_stability_demo.py --json > reports/trails/ci/nash_route_stability.json"
            echo '```'
            echo ""
            echo "### Downloadable artifact"
            echo ""
            echo "- Name: \`cognitive-trail-report-${GITHUB_SHA}\`"
            echo "- Retention: 14 days"
            echo ""
            echo "### Files inside the artifact"
            echo ""
            echo "- \`reports/trails/ci/cognitive_trail_run.json\` — canonical machine-checkable Cognitive Trail Run"
            echo "- \`reports/trails/ci/cognitive_trail_run_report.md\` — human-readable reviewer report"
            echo "- \`reports/trails/ci/nash_route_stability.json\` — Nash-style route stability proxy result"
            echo ""
            echo "### Interpretation boundary"
            echo ""
            echo "This artifact shows that LS can generate, validate, and expose one local PR-review Cognitive Trail Run and one Nash-style route stability proxy."
            echo "It does not claim global model ranking, production-grade evaluation, formal Nash equilibrium, or a global live Cognitive Trail Network."
          } >> "$GITHUB_STEP_SUMMARY"
