name: Operational continuity fixtures

on:
  pull_request:
    paths:
      - "spec/operational-continuity-fixtures-v0.1.md"
      - "spec/inter-agent-dispatch-audit-v0.1.md"
      - "fixtures/operational-continuity/**"
      - "tools/run_operational_continuity_fixtures.py"
      - "tools/validate_recovered_evidence_v0_2.py"
      - "tools/validate_inter_agent_dispatch_audit_v0_1.py"
  push:
    branches:
      - main
    paths:
      - "spec/operational-continuity-fixtures-v0.1.md"
      - "spec/inter-agent-dispatch-audit-v0.1.md"
      - "fixtures/operational-continuity/**"
      - "tools/run_operational_continuity_fixtures.py"
      - "tools/validate_recovered_evidence_v0_2.py"
      - "tools/validate_inter_agent_dispatch_audit_v0_1.py"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mandatory fixtures
        run: |
          python tools/run_operational_continuity_fixtures.py \
            fixtures/operational-continuity/resume_no_duplicate_side_effect.json \
            fixtures/operational-continuity/superseded_approval_rejected.json \
            fixtures/operational-continuity/complete_chain_preferred_over_disconnected_facts.json \
            fixtures/operational-continuity/workspace_drift_requires_revalidation.json
      - name: Validate recovered evidence envelope v0.2
        run: |
          python tools/validate_recovered_evidence_v0_2.py \
            fixtures/operational-continuity/shared-envelope/resumed_constraint_defer_v0.2.json \
            fixtures/operational-continuity/shared-envelope/schema-v0.2.json
      - name: Validate inter-agent dispatch audit v0.1
        run: |
          python tools/validate_inter_agent_dispatch_audit_v0_1.py \
            fixtures/operational-continuity/inter-agent-dispatch-audit/dispatch_chain_v0.1.json \
            fixtures/operational-continuity/inter-agent-dispatch-audit/schema-v0.1.json
