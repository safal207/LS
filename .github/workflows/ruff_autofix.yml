name: Ruff Auto-fix

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "python/**"

permissions:
  contents: write

concurrency:
  group: ruff-autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Auto-fix ruff issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.fork == false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run ruff autofix
        run: ruff check python --fix

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add python
            git commit -m "style: auto-fix ruff issues"
            git push
          fi
