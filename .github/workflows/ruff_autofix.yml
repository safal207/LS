name: Ruff Auto-fix

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "python/**"
      - ".github/workflows/ruff_autofix.yml"

permissions:
  contents: write

concurrency:
  group: ruff-autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Auto-fix ruff issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.fork == false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Apply one-time Ruff cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("python/modules/trusted_runtime/authorization.py")
          text = source.read_text(encoding="utf-8")
          old = '''    for field in ("task_id", "trail_id", "policy_version", "nonce"):
              if manifest.get(field) != authorization_payload.get(field):
                  raise AuthorizationMismatchError(f"authorization field mismatch:{field}")
          '''
          new = '''    for field_name in ("task_id", "trail_id", "policy_version", "nonce"):
              if manifest.get(field_name) != authorization_payload.get(field_name):
                  raise AuthorizationMismatchError(
                      f"authorization field mismatch:{field_name}"
                  )
          '''
          if old not in text:
              raise SystemExit("expected Ruff F402 snippet was not found")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path("python/ruff-diagnostics.txt").unlink(missing_ok=True)
          PY

          cat > .github/workflows/ruff_autofix.yml <<'EOF'
          name: Ruff Auto-fix

          on:
            pull_request:
              branches:
                - "main"
              paths:
                - "python/**"
                - ".github/workflows/ruff_autofix.yml"

          permissions:
            contents: write

          concurrency:
            group: ruff-autofix-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            autofix:
              name: Auto-fix ruff issues
              runs-on: ubuntu-latest
              timeout-minutes: 10
              if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.fork == false

              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.head_ref }}
                    token: ${{ secrets.GITHUB_TOKEN }}
                    fetch-depth: 0

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                    cache: pip

                - name: Install ruff
                  run: python -m pip install --upgrade pip ruff

                - name: Collect changed Python files
                  id: changed-python
                  shell: bash
                  run: |
                    mapfile -d '' files < <(
                      git diff --name-only --diff-filter=ACMRT -z \
                        "origin/${{ github.base_ref }}...HEAD" \
                        -- 'python/**/*.py' 'python/*.py'
                    )

                    printf '%s\0' "${files[@]}" > /tmp/ruff-files
                    echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

                    if (( ${#files[@]} == 0 )); then
                      echo "No changed Python files require Ruff validation."
                    else
                      printf 'Changed Python files (%s):\n' "${#files[@]}"
                      printf ' - %s\n' "${files[@]}"
                    fi

                - name: Run ruff autofix
                  if: steps.changed-python.outputs.count != '0'
                  run: xargs -0 --no-run-if-empty ruff check --fix < /tmp/ruff-files

                - name: Verify changed Python files
                  if: steps.changed-python.outputs.count != '0'
                  run: xargs -0 --no-run-if-empty ruff check < /tmp/ruff-files

                - name: Commit and push if changed
                  run: |
                    if ! git diff --quiet; then
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      git add python
                      git commit -m "style: auto-fix ruff issues"
                      git push
                    fi
          EOF

          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMRT -z \
              "origin/${{ github.base_ref }}...HEAD" \
              -- 'python/**/*.py' 'python/*.py'
          )
          printf '%s\0' "${files[@]}" | \
            xargs -0 --no-run-if-empty ruff check --fix
          printf '%s\0' "${files[@]}" | \
            xargs -0 --no-run-if-empty ruff check

      - name: Commit cleanup and restored workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add python .github/workflows/ruff_autofix.yml
          git commit -m "fix: resolve Ruff shadowed import diagnostic"
          git push
