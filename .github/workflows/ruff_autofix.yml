name: Ruff Auto-fix

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "python/**"
      - ".github/workflows/ruff_autofix.yml"

permissions:
  contents: write

concurrency:
  group: ruff-autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Auto-fix ruff issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.fork == false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Apply and verify one-time Ruff cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("python/modules/trusted_runtime/authorization.py")
          text = source.read_text(encoding="utf-8")
          replacements = (
              (
                  'for field in ("task_id", "trail_id", "policy_version", "nonce"):',
                  'for field_name in ("task_id", "trail_id", "policy_version", "nonce"):',
              ),
              (
                  "manifest.get(field) != authorization_payload.get(field)",
                  "manifest.get(field_name) != authorization_payload.get(field_name)",
              ),
              (
                  'raise AuthorizationMismatchError(f"authorization field mismatch:{field}")',
                  'raise AuthorizationMismatchError(\n'
                  '                f"authorization field mismatch:{field_name}"\n'
                  '            )',
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one occurrence of: {old}")
              text = text.replace(old, new, 1)
          source.write_text(text, encoding="utf-8")
          Path("python/ruff-diagnostics.txt").unlink(missing_ok=True)
          PY

          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMRT -z \
              "origin/${{ github.base_ref }}...HEAD" \
              -- 'python/**/*.py' 'python/*.py'
          )
          printf '%s\0' "${files[@]}" | \
            xargs -0 --no-run-if-empty ruff check --fix
          printf '%s\0' "${files[@]}" | \
            xargs -0 --no-run-if-empty ruff check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add python
          git commit -m "fix: resolve Ruff shadowed import diagnostic"
          git push
