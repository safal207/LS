name: Ruff Auto-fix

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "python/**"
      - ".github/workflows/ruff_autofix.yml"

permissions:
  contents: write

concurrency:
  group: ruff-autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Auto-fix ruff issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.fork == false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff==0.15.5

      - name: Collect changed Python files
        id: changed-python
        shell: bash
        run: |
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMRT -z \
              "origin/${{ github.base_ref }}...HEAD" \
              -- 'python/**/*.py' 'python/*.py'
          )

          printf '%s\0' "${files[@]}" > /tmp/ruff-files
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

          if (( ${#files[@]} == 0 )); then
            echo "No changed Python files require Ruff validation."
          else
            printf 'Changed Python files (%s):\n' "${#files[@]}"
            printf ' - %s\n' "${files[@]}"
          fi

      - name: Run ruff autofix
        if: steps.changed-python.outputs.count != '0'
        run: xargs -0 --no-run-if-empty ruff check --fix < /tmp/ruff-files

      - name: Verify changed Python files
        if: steps.changed-python.outputs.count != '0'
        run: xargs -0 --no-run-if-empty ruff check < /tmp/ruff-files

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add python
            git commit -m "style: auto-fix ruff issues"
            git push
          fi
