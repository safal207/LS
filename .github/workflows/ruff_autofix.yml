name: Ruff Auto-fix

on:
  pull_request:
    branches: ["main"]
    paths:
      - "python/**"
      - ".github/workflows/ruff_autofix.yml"

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff pytest jsonschema
      - name: Fix authorization event parent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("python/modules/trusted_runtime/authorization.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "def authorization_bundle_event(bundle: AuthorizationBundle) -> TrailEvent:\n",
              "def authorization_bundle_event(\n"
              "    bundle: AuthorizationBundle,\n"
              "    *,\n"
              "    parent_event_id: Optional[str] = None,\n"
              ") -> TrailEvent:\n"
              "    decision_event_id = parent_event_id or (\n"
              "        f\"event-{bundle.decision_ref.split(':')[-1][:16]}\"\n"
              "    )\n",
              1,
          )
          text = text.replace(
              "        parent_cause=bundle.decision_ref,\n",
              "        parent_cause=decision_event_id,\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          tests = Path("python/tests/test_trusted_runtime_evidence_authorization.py")
          test_text = tests.read_text(encoding="utf-8")
          test_text = test_text.replace(
              "    assert event.evidence_refs == bundle.evidence_refs\n",
              "    assert event.evidence_refs == bundle.evidence_refs\n"
              "    assert event.parent_cause == (\n"
              "        f\"event-{bundle.decision_ref.split(':')[-1][:16]}\"\n"
              "    )\n",
              1,
          )
          tests.write_text(test_text, encoding="utf-8")
          PY
          ruff check --fix python/modules/trusted_runtime python/tests/test_trusted_runtime_evidence_authorization.py
          ruff check python/modules/trusted_runtime python/tests/test_trusted_runtime_evidence_authorization.py
          PYTHONPATH=.:python:python/modules python -m pytest python/tests/test_trusted_runtime_evidence_authorization.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add python
          git commit -m "fix: bind authorization event to decision event"
          git push
