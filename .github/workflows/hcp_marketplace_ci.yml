name: HCP Marketplace MVP

on:
  push:
    branches: [main]
    paths:
      - "python/modules/hcp_marketplace/**"
      - "python/tests/test_hcp_marketplace.py"
      - "scripts/run_hcp_marketplace_api.py"
      - "scripts/hcp_load_plugin.py"
      - ".github/workflows/hcp_marketplace_ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/modules/hcp_marketplace/**"
      - "python/tests/test_hcp_marketplace.py"
      - "scripts/run_hcp_marketplace_api.py"
      - "scripts/hcp_load_plugin.py"
      - ".github/workflows/hcp_marketplace_ci.yml"

jobs:
  hcp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run HCP marketplace tests
        run: |
          mkdir -p artifacts
          PYTHONPATH=python python -m pytest python/tests/test_hcp_marketplace.py -v --tb=short \
            --junitxml=artifacts/hcp-junit.xml
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcp-junit
          path: artifacts/hcp-junit.xml
          if-no-files-found: ignore
