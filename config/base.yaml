hardware:
  max_ram_usage_mb: 4000
  target_latency_sec: 7

audio:
  sample_rate: 16000

stt:
  whisper_model_size: small

llm:
  model_name: qwen2.5:7b
  ram_aware: true
  heavy_model: "qwen2.5:7b-instruct-q5_k_m"
  light_model: "phi4:mini-q5_k_m"
  ram_threshold_gb: 6.0
  use_cloud: false
  use_cotcore: false
  use_breaker: false
  backend: gonka
  fallback_backend: cloud,local
  meritocracy:
    enabled: false
    backends: gonka,mimo,cloud,local
    min_overall: 0.35
    min_relevance: 0.25
    min_thread_relevance: 0.25
    max_hallucination_risk: 0.65
  temporal_enabled: true
  breaker:
    failure_threshold: 3
    cooldown_seconds: 10
  system_prompt: |
    You are a senior developer interviewing candidates. 
    Provide concise, bullet-point answers suitable for technical interviews.
    Focus on practical knowledge and real-world applications.
    Answer in Russian since the interview is conducted in Russian.
  groq:
    api_key: ""
    model: llama3-8b-8192
    base_url: https://api.groq.com/openai/v1
    timeout_sec: 120
  gonka:
    enabled: false
    api_key: ""
    base_url: https://api.gonkagate.com/v1
    model: openai/gpt-oss-120b
    timeout_sec: 120
  mimo:
    enabled: false
    api_key: ""
    base_url: https://platform.xiaomimimo.com/v1
    model: ""
    timeout_sec: 120
  ollama:
    host: http://localhost:11434
    timeout: 30
    num_predict: 220

agent:
  enabled: false
  cancel_on_new_input: true
  cancel_grace_ms: 0
  memory_max_chars: 2000
  metrics_enabled: true
  observability_enabled: true
  event_sink: "print"

question_keywords:
  - "почему"
  - "зачем"
  - "как"
  - "что"
  - "чем"
  - "когда"
  - "где"
  - "объясните"
  - "расскажите"
  - "опишите"
  - "в чём"
  - "в чем"
  - "разница"
  - "отличие"

paths: {}
