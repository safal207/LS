[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ls-agent-trust-runtime"
version = "0.1.0"
description = "Evidence-bound dispatch, recovery, and human authority for OpenAI Agents SDK teams"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "LS contributors"}]
dependencies = [
  "openai-agents",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ls-agent-trust-demo = "ls_agent_trust.openai_demo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
