rules:
  - id: phase12-duplicate-autonomy-metrics-in-agent-finalize
    message: >-
      BLOCKER: self.autonomy.update_autonomy_metrics() is called in _finalize_step().
      If AutonomyEngine.update() also updates metrics, autonomy_trace is double-counted.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - python/modules/nca/agent.py
    patterns:
      - pattern-inside: |
          def _finalize_step(self, ...):
              ...
      - pattern: self.autonomy.update_autonomy_metrics()
    metadata:
      category: phase12.1
      impact: high
      fix: Remove one of the per-step update_autonomy_metrics() calls.

  - id: phase12-duplicate-autonomy-metrics-in-autonomy-update
    message: >-
      BLOCKER: update_autonomy_metrics() is called inside AutonomyEngine.update().
      If agent finalize also updates metrics, autonomy_trace is double-counted.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - python/modules/nca/autonomy_engine.py
    patterns:
      - pattern-inside: |
          def update(self, ...):
              ...
      - pattern: self.update_autonomy_metrics()
    metadata:
      category: phase12.1
      impact: high
      fix: Keep exactly one metrics update per agent step.

  - id: phase12-ci-missing-nca-path-filter
    message: >-
      MEDIUM: Workflow has pull_request path filters but misses python/modules/nca/**.
      DCP regressions may not run in CI.
    severity: WARNING
    languages:
      - generic
    paths:
      include:
        - .github/workflows/*.yml
        - .github/workflows/*.yaml
    patterns:
      - pattern-regex: '(?s)\bon:\s*.*\bpull_request\s*:\s*.*\bpaths\s*:'
      - pattern-not-regex: 'python/modules/nca/\*\*'
    metadata:
      category: phase12.1
      impact: medium
      fix: Add python/modules/nca/** to pull_request.paths.

  - id: phase12-ci-missing-dcp-test-path-filter
    message: >-
      MEDIUM: Workflow has pull_request path filters but misses tests/test_context_propagation.py (or tests/**).
      DCP tests can stay unexecuted while PR stays green.
    severity: WARNING
    languages:
      - generic
    paths:
      include:
        - .github/workflows/*.yml
        - .github/workflows/*.yaml
    patterns:
      - pattern-regex: '(?s)\bon:\s*.*\bpull_request\s*:\s*.*\bpaths\s*:'
      - pattern-not-regex: '(tests/test_context_propagation\.py|tests/\*\*)'
    metadata:
      category: phase12.1
      impact: medium
      fix: Add tests/** or tests/test_context_propagation.py to pull_request.paths.

  - id: phase12-mixed-api-usage-inside-update
    message: >-
      INFO: update(context) still calls legacy update_from_*/generate/select helpers.
      This may be intentional as an adapter layer, but review for deterministic flow consistency.
    severity: INFO
    languages:
      - python
    paths:
      include:
        - python/modules/nca/**
    patterns:
      - pattern-inside: |
          def update(self, ...):
              ...
      - pattern-either:
          - pattern: $OBJ.update_from_social(...)
          - pattern: $OBJ.update_from_values(...)
          - pattern: $OBJ.update_from_collective(...)
          - pattern: $OBJ.generate_strategies(...)
          - pattern: $OBJ.apply_cooperative_regulation(...)
          - pattern: $OBJ.select_strategy(...)
    metadata:
      category: phase12.1
      impact: low-medium
      note: Informational only. Not a release blocker.
