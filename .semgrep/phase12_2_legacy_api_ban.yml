rules:
  - id: phase12-2-agent-step-no-legacy-engine-calls
    message: >-
      BLOCKER: agent.step() must orchestrate engine updates via update(context) only.
      Legacy direct engine calls are forbidden in Phase 12.2.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - /python/modules/nca/agent.py
    patterns:
      - pattern-inside: |
          def step(self, ...):
              ...
      - pattern: self.$ENGINE.$METHOD(...)
      - metavariable-regex:
          metavariable: $ENGINE
          regex: "^(identitycore|social|culture|militocracy|synergy|values|autonomy|intentengine)$"
      - metavariable-regex:
          metavariable: $METHOD
          regex: "^(update_from_|generate_|select_|apply_|infer_|evaluate_).+"
    metadata:
      category: phase12.2
      impact: high
      fix: Route engine behavior through update(context) only.

  - id: phase12-2-engine-update-no-legacy-self-calls
    message: >-
      BLOCKER: update(context) contains legacy helper call prefix
      (update_from_/generate_/select_/apply_/infer_/evaluate_).
      Move this logic behind context-driven internals.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - /python/modules/nca/identity_core.py
        - /python/modules/nca/social_cognition.py
        - /python/modules/nca/culture_engine.py
        - /python/modules/nca/militocracy_engine.py
        - /python/modules/nca/synergy_engine.py
        - /python/modules/nca/value_system.py
        - /python/modules/nca/autonomy_engine.py
        - /python/modules/nca/intent_engine.py
    patterns:
      - pattern-inside: |
          def update(self, context, ...):
              ...
      - pattern: self.$METHOD(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: "^(update_from_|generate_|select_|apply_|infer_|evaluate_).+"
    metadata:
      category: phase12.2
      impact: high
      note: >-
        This is intentionally strict and expected to produce findings until full
        Phase 12.2 migration is complete.
