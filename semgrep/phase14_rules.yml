rules:
  - id: nca-update-outside-global-coordinator
    message: "NCAAgent.step() должен вызываться только через GlobalTickCoordinator/step_all deterministic flow."
    severity: ERROR
    languages: [python]
    paths:
      include:
        - python/modules/nca/*.py
    patterns:
      - pattern: $AGENT.step(...)
      - pattern-not-inside: |
          def step_all(...):
            ...
      - pattern-not-inside: |
          class GlobalTickCoordinator:
            ...

  - id: collective-state-write-outside-tick
    message: "Изменение collective_state должно происходить внутри tick/step_all барьера."
    severity: WARNING
    languages: [python]
    paths:
      include:
        - python/modules/nca/*.py
    patterns:
      - pattern: $AGENT.collective_state = $X
      - pattern-not-inside: |
          def step_all(...):
            ...
      - pattern-not-inside: |
          def tick(...):
            ...

  - id: forbidden-updatefrom-calls
    message: "Не использовать прямые updatefrom* вызовы в Phase 14; используйте update(context)."
    severity: ERROR
    languages: [python]
    paths:
      include:
        - python/modules/nca/*.py
    pattern-regex: "\\.updatefrom[a-zA-Z0-9_]*\\("

  - id: engine-side-effects-without-context
    message: "Engine update должен быть context-native (update(context))."
    severity: WARNING
    languages: [python]
    paths:
      include:
        - python/modules/nca/*.py
    patterns:
      - pattern: $ENGINE.update_from_$X(...)
      - pattern-not-inside: |
          class SynergyEngine:
            ...
      - pattern-not-inside: |
          class MilitocracyEngine:
            ...

  - id: multiagent-must-use-deterministic-signal-bus
    message: "MultiAgentSystem должен использовать DeterministicSignalBus в качестве collective_signal_bus."
    severity: ERROR
    languages: [python]
    paths:
      include:
        - python/modules/nca/multiagent.py
    patterns:
      - pattern: collective_signal_bus: $T = field(default_factory=$F)
      - metavariable-comparison:
          metavariable: $F
          comparison: str($F) != "DeterministicSignalBus"

  - id: deterministic-bus-batch-must-use-islice
    message: "Batch processing must use itertools.islice() for performance."
    severity: WARNING
    languages: [python]
    paths:
      include:
        - python/modules/nca/signals.py
    patterns:
      - pattern: "[$X.popleft() for ... in range($N)]"
